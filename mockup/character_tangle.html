<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{color-scheme:light}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Character Tangle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app — slim masthead, full-bleed physics stage, docked dossier rail that reflows under the stage on phones. */
:root{
  --bg:#eef0f3;
  --panel:#f8f9fb;
  --ink:#1a1d24;
  --ink-soft:#5a6170;
  --ink-faint:#8d93a1;
  --rule:#d3d7df;
  --rule-soft:#e3e6ec;
  --pos:#1f7a5e;
  --neg:#b22f45;
  --cpx:#9a6a12;
  --sphere:#636c80;
  --focus:#2f5fd0;
  --shadow:rgba(26,29,36,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116;
    --panel:#161a21;
    --ink:#e8eaef;
    --ink-soft:#a0a7b6;
    --ink-faint:#6e7686;
    --rule:#2a303b;
    --rule-soft:#20252e;
    --pos:#4ecfa3;
    --neg:#ff7183;
    --cpx:#e8b155;
    --sphere:#8690a8;
    --focus:#7aa2ff;
    --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116;
  --panel:#161a21;
  --ink:#e8eaef;
  --ink-soft:#a0a7b6;
  --ink-faint:#6e7686;
  --rule:#2a303b;
  --rule-soft:#20252e;
  --pos:#4ecfa3;
  --neg:#ff7183;
  --cpx:#e8b155;
  --sphere:#8690a8;
  --focus:#7aa2ff;
  --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{height:100%}
body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.masthead{
  display:flex;
  align-items:baseline;
  gap:14px;
  flex-wrap:wrap;
  padding-block:10px 9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--rule);
  background:var(--panel);
}
.wordmark{
  font-family:"Fraunces",Georgia,serif;
  font-weight:800;
  font-size:19px;
  letter-spacing:-.015em;
  margin:0;
}
.wordmark em{font-style:italic;font-weight:600;color:var(--ink-soft)}
.tagline{
  font-size:12px;
  color:var(--ink-soft);
  margin:0;
  max-width:52ch;
  line-height:1.45;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px 14px;
  padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--rule);
  background:var(--panel);
}
.ctl{display:flex;align-items:center;gap:7px}
.ctl label{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--ink-faint);
  white-space:nowrap;
}
input[type=range]{width:96px;accent-color:var(--focus)}
.count{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;
  color:var(--ink);
  min-width:2ch;
  font-variant-numeric:tabular-nums;
}
select,button{
  font-family:inherit;
  font-size:12.5px;
  color:var(--ink);
  background:var(--bg);
  border:1px solid var(--rule);
  border-radius:3px;
  padding:5px 9px;
  cursor:pointer;
}
button:hover,select:hover{border-color:var(--ink-faint)}
button:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible{
  outline:2px solid var(--focus);
  outline-offset:2px;
}
.primary{
  background:var(--ink);
  color:var(--panel);
  border-color:var(--ink);
  font-weight:600;
  letter-spacing:.01em;
}
.primary:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:4px 8px;
  border:1px solid var(--rule);
  border-radius:999px;
  background:transparent;
  color:var(--ink-faint);
}
.chip[aria-pressed="true"]{
  background:var(--ink);
  color:var(--panel);
  border-color:var(--ink);
}

.premise{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  gap:6px 26px;
  padding-block:11px 12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--rule);
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 70%,var(--bg)),var(--bg));
}
.phead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;min-width:0;flex:0 1 auto}
.pcat{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-faint);
  margin:0;
  order:-1;
  flex-basis:100%;
}
.ptitle{
  font-family:"Fraunces",Georgia,serif;
  font-size:19px;
  font-weight:800;
  letter-spacing:-.015em;
  margin:0;
  text-wrap:balance;
}
.preg{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9.5px;
  letter-spacing:.09em;
  text-transform:uppercase;
  padding:2px 7px;
  border-radius:999px;
  border:1px solid currentColor;
}
.reg-e{color:var(--neg)}
.reg-s{color:var(--pos)}
.pbody{flex:1 1 320px;min-width:0;display:grid;gap:3px}
.pbody .seed{margin:0;font-size:13px;line-height:1.45;color:var(--ink)}
.pbody .pcast{margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
.who{
  font:inherit;
  font-weight:600;
  color:var(--ink);
  background:none;
  border:none;
  padding:0;
  cursor:pointer;
  border-bottom:1px solid var(--rule);
}
.who:hover{border-bottom-color:var(--ink);color:var(--focus)}

.workspace{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 310px;
}
.stage{
  position:relative;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:
    radial-gradient(120% 120% at 50% 0%, color-mix(in srgb, var(--panel) 55%, transparent), transparent 70%),
    var(--bg);
}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}

/* the web alone is the default; F2 brings the rest back */
body.bare .masthead,
body.bare .controls,
body.bare .premise,
body.bare .rail{display:none}
body.bare .workspace{grid-template-columns:1fr;grid-template-rows:1fr}

.chrome-toggle{
  position:absolute;
  z-index:6;
  top:calc(10px + env(safe-area-inset-top,0px));
  right:max(12px,env(safe-area-inset-right,0px));
  display:flex;
  align-items:center;
  gap:6px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--ink-faint);
  background:color-mix(in srgb,var(--panel) 80%,transparent);
  border:1px solid var(--rule-soft);
  border-radius:999px;
  padding:5px 10px;
  backdrop-filter:blur(6px);
  cursor:pointer;
}
.chrome-toggle:hover{color:var(--ink);border-color:var(--rule)}
.chrome-toggle kbd{
  font-family:inherit;
  font-size:9.5px;
  border:1px solid var(--rule);
  border-radius:3px;
  padding:1px 4px;
  color:var(--ink-soft);
}

.legend{
  position:absolute;
  left:max(14px,env(safe-area-inset-left,0px));
  bottom:14px;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  border:1px solid var(--rule-soft);
  border-radius:4px;
  padding:9px 11px;
  display:grid;
  gap:5px;
  backdrop-filter:blur(6px);
  pointer-events:none;
}
.legend h2{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9.5px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-faint);
  margin:0 0 2px;
  font-weight:500;
}
.legend .row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-soft)}
.legend svg{display:block;flex:none}

.tip{
  position:absolute;
  pointer-events:none;
  max-width:230px;
  background:var(--ink);
  color:var(--panel);
  border-radius:4px;
  padding:7px 9px;
  font-size:11.5px;
  line-height:1.4;
  box-shadow:0 6px 18px var(--shadow);
  transform:translate(-50%,-115%);
  z-index:5;
}
.tip strong{
  display:block;
  font-family:"Fraunces",Georgia,serif;
  font-size:13px;
  font-weight:600;
  margin-bottom:2px;
}
.tip .roles{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;
  letter-spacing:.04em;
  opacity:.72;
  margin-top:3px;
}

.rail{
  border-left:1px solid var(--rule);
  background:var(--panel);
  overflow-y:auto;
  min-height:0;
  padding-block:14px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.rail h2{
  font-family:"Fraunces",Georgia,serif;
  font-size:16px;
  font-weight:600;
  margin:0 0 2px;
  text-wrap:balance;
}
.rail .sub{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-faint);
  margin:0 0 12px;
}
.backlink{
  font-size:11.5px;
  color:var(--focus);
  background:none;
  border:none;
  padding:0 0 10px;
  cursor:pointer;
}
.ties{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--rule-soft)}
.ties li{background:var(--panel);padding:9px 0}
.tie{
  width:100%;
  text-align:left;
  background:none;
  border:none;
  padding:0;
  cursor:pointer;
  display:grid;
  gap:3px;
}
.tie .pair{
  font-size:12px;
  color:var(--ink-soft);
  display:flex;
  gap:5px;
  align-items:baseline;
  flex-wrap:wrap;
}
.tie .arrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500}
.tie .name{
  font-family:"Fraunces",Georgia,serif;
  font-size:14px;
  font-weight:600;
  color:var(--ink);
  line-height:1.25;
}
.tie .gloss{font-size:11.5px;color:var(--ink-faint);line-height:1.45}
.tie:hover .name{text-decoration:underline;text-underline-offset:2px}
.railhead{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10px;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--ink-faint);
  font-weight:500;
  margin:18px 0 7px;
  padding-bottom:5px;
  border-bottom:1px solid var(--rule-soft);
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:baseline;
}
.railhead .hint{letter-spacing:.02em;text-transform:none;color:var(--ink-faint);font-size:10px}
.blurb{font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin:0}
.source{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:10.5px;
  color:var(--ink-faint);
  margin:-8px 0 10px;
}
.identity{border-top:1px solid var(--rule-soft);padding-top:10px;margin-top:14px}
.identnote{font-size:11.5px;line-height:1.45;color:var(--ink-faint);margin:6px 0 0}
.castline .code,.pair .code{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  font-weight:500;
  letter-spacing:.06em;
  color:var(--panel);
  background:var(--sphere);
  border-radius:3px;
  padding:2px 5px;
}
.castline .arch{color:var(--ink-soft)}

.chemrow{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:2px 9px;
  align-items:baseline;
  padding:5px 0;
  border-bottom:1px solid var(--rule-soft);
}
.chemrow .ccode{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;
  font-weight:500;
  letter-spacing:.05em;
  color:var(--ink-faint);
}
.chemrow.c-with .ccode{color:var(--pos)}
.chemrow.c-against .ccode{color:var(--neg)}
.chemrow .cwhy{font-size:11.5px;line-height:1.4;color:var(--ink-soft)}
.chemrow .chere{grid-column:2;font-size:11.5px;color:var(--ink)}
.chemrow .chere::before{content:"on the board: ";color:var(--ink-faint);font-size:10.5px}
.chemrow.here .ccode{text-decoration:underline;text-underline-offset:3px}
.chemtag{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9.5px;
  letter-spacing:.04em;
  white-space:nowrap;
}
.chemtag.c-with{color:var(--pos)}
.chemtag.c-against{color:var(--neg)}

.dich{margin:0 0 12px}
.dich h3{
  display:flex;
  align-items:baseline;
  gap:7px;
  margin:10px 0 6px;
  font-family:"IBM Plex Sans",sans-serif;
  font-size:11.5px;
  font-weight:600;
  color:var(--ink-soft);
}
.dich .letter{
  font-family:"Fraunces",Georgia,serif;
  font-size:15px;
  font-weight:800;
  color:var(--ink);
}
.dich .flag{
  margin-left:auto;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9.5px;
  letter-spacing:.05em;
  color:var(--cpx);
  font-weight:400;
}
.facet{display:grid;gap:3px;margin-bottom:7px}
.facet .poles{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:9.5px;
  letter-spacing:.02em;
  color:var(--ink-faint);
}
.facet .poles .on{color:var(--ink)}
.facet .track{
  position:relative;
  height:3px;
  border-radius:2px;
  background:var(--rule-soft);
}
.facet .track::before{
  content:"";
  position:absolute;
  left:50%;top:-2px;
  width:1px;height:7px;
  background:var(--rule);
}
.facet .track i{
  position:absolute;
  top:-3px;
  width:9px;height:9px;
  border-radius:50%;
  transform:translateX(-50%);
  background:var(--ink);
  border:2px solid var(--panel);
}
.facet.s-mid .track i{background:var(--ink-faint)}
.facet.s-oops .track i{background:var(--cpx)}
.facet.s-oops .poles .on{color:var(--cpx)}

.v-p{color:var(--pos)}
.v-n{color:var(--neg)}
.v-x{color:var(--cpx)}
.empty{font-size:12px;color:var(--ink-faint);line-height:1.5}

@media (max-width:860px){
  .workspace{grid-template-columns:1fr;grid-template-rows:minmax(44vh,1fr) minmax(0,38%)}
  .rail{border-left:none;border-top:1px solid var(--rule)}
  .legend{right:max(14px,env(safe-area-inset-right,0px));left:auto;bottom:10px;padding:7px 9px}
  .legend .row{font-size:10px}
}
@media (max-width:520px){
  .tagline{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto}
}
</style>

</head>
<body>
<header class="masthead">
  <h1 class="wordmark">Character <em>Tangle</em></h1>
  <p class="tagline">A cast of strangers, roped together by the dynamics that actually drive stories. Drag anyone. Click a sphere to read their ties.</p>
</header>

<div class="controls">
  <button class="primary" id="roll">Recast</button>
  <div class="ctl">
    <label for="cast">Cast</label>
    <input type="range" id="cast" min="4" max="14" value="5">
    <span class="count" id="castN">5</span>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Kinds of dynamic to include"></div>
  <div class="ctl">
    <label for="register">Register</label>
    <select id="register">
      <option value="r" selected>Either</option>
      <option value="e">Extreme</option>
      <option value="s">Silly</option>
    </select>
  </div>
  <button id="replot">New plot</button>
  <button id="copy">Copy as text</button>
</div>

<section class="premise" id="premise" aria-live="polite"></section>

<main class="workspace">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <button class="chrome-toggle" id="chromeToggle" aria-pressed="false">panels <kbd>F2</kbd></button>
    <div class="legend">
      <h2>Reading the lines</h2>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><line x1="1" y1="5" x2="39" y2="5" stroke="var(--pos)" stroke-width="2"/></svg> mostly warm</div>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><line x1="1" y1="5" x2="39" y2="5" stroke="var(--neg)" stroke-width="2" stroke-dasharray="7 5"/></svg> mostly hostile</div>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><path d="M1 5 q5 -4 10 0 t10 0 t10 0 t8 0" fill="none" stroke="var(--cpx)" stroke-width="2"/></svg> complicated</div>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><line x1="1" y1="5" x2="32" y2="5" stroke="currentColor" stroke-width="1.6"/><path d="M39 5 L31 1.6 L31 8.4 Z" fill="currentColor"/></svg> one-way</div>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><line x1="8" y1="5" x2="32" y2="5" stroke="currentColor" stroke-width="1.6"/><path d="M39 5 L31 1.6 L31 8.4 Z" fill="currentColor"/><path d="M1 5 L9 1.6 L9 8.4 Z" fill="currentColor"/></svg> mutual</div>
    </div>
  </div>
  <aside class="rail" id="rail"></aside>
</main>

<script>
/* ---------- the trope library: [name, kind, valence, directedness, roleA, roleB, gloss] ---------- */
const K={ROM:"romance",FRI:"friendship",FAM:"family",MEN:"mentorship",RIV:"rivalry",POW:"power",ALL:"alliance",DEV:"devotion"};
const RAW=[
["Enemies to Lovers",K.ROM,"x",2,"Antagonist","Antagonist","Hostility that keeps inventing reasons to be in the same room."],
["Friends to Lovers",K.ROM,"p",2,"Friend","Friend","Years of safety, then one of them says it out loud."],
["Lovers to Enemies",K.ROM,"n",2,"Ex","Ex","They know exactly where the soft parts are."],
["Slow Burn",K.ROM,"p",2,"Half","Half","Everyone else worked it out three chapters ago."],
["Star-Crossed",K.ROM,"x",2,"Beloved","Beloved","The world is arranged specifically to keep them apart."],
["Unrequited Love",K.ROM,"x",1,"Pining","Oblivious","One of them is having an entire relationship alone."],
["Fake Dating",K.ROM,"x",2,"Accomplice","Accomplice","A lie that keeps requiring more honest behaviour."],
["Second Chance",K.ROM,"p",2,"Returning","Waiting","Older, slower, finally able to hear each other."],
["Forbidden Love",K.ROM,"x",2,"Beloved","Beloved","Wanting it costs them standing, family, or safety."],
["Opposites Attract",K.ROM,"p",2,"Order","Chaos","Each one is the other's missing operating instruction."],
["The One That Got Away",K.ROM,"x",1,"Still Carrying It","Moved On","A door only one of them is still standing at."],
["Will They Won't They",K.ROM,"x",2,"Almost","Almost","Perpetual near-miss, sustained by terrible timing."],
["Arranged Match",K.ROM,"x",2,"Promised","Promised","A contract between families, two strangers inside it."],
["Secret Relationship",K.ROM,"x",2,"Lover","Lover","Real in private, denied in every room that matters."],
["Toxic Devotion",K.ROM,"n",2,"Captive","Captive","Neither can leave; both keep proving why they should."],
["Marriage of Convenience",K.ROM,"x",2,"Signatory","Signatory","A merger that slowly stops being only a merger."],
["Grumpy and Sunshine",K.ROM,"p",2,"Grump","Sunshine","One scowls, one persists, the scowl stops working."],
["Childhood Sweethearts",K.ROM,"p",2,"First Love","First Love","They have no memory of each other's absence."],
["Soulmates",K.ROM,"p",2,"Half","Half","Recognition that arrives before acquaintance does."],
["Doomed Romance",K.ROM,"x",2,"Beloved","Beloved","Both know the ending and keep going anyway."],
["Rebound",K.ROM,"x",1,"Rebounding","Stand-in","Loving someone in the shape of someone else."],
["Mutual Pining",K.ROM,"x",2,"Pining","Pining","Two people being carefully, symmetrically stupid."],

    let scores=pairs.map(()=>{
      const r=rand();
      let mag,sign;
      if(r<0.17){mag=rand();sign=rand()<0.5?-1:1;}                       // midzone
      else if(r<0.32){mag=2+rand()*2.4;sign=toLeft?1:-1;}                // out-of-preference
      else {mag=2+rand()*3;sign=toLeft?-1:1;}                            // in-preference
      return +(sign*mag).toFixed(1);
    });
    // the facets must still add up to the reported letter
    let guard=0;
    while(guard++<6){
      const sum=scores.reduce((a,b)=>a+b,0);
      if(toLeft?sum<0:sum>0)break;
      let worst=0;
      scores.forEach((s,i)=>{if((toLeft?s:-s)>(toLeft?scores[worst]:-scores[worst]))worst=i});
      scores[worst]=+((toLeft?-1:1)*(2.6+rand()*2.4)).toFixed(1);
    }
    return {d:di,scores};
  });
}
function facetState(score,letterIsLeft){
  if(Math.abs(score)<=1)return "mid";
  return (score<0)===letterIsLeft?"in":"oops";
}
function oopsCount(p,code){
  let k=0;
  p.forEach(g=>{const [L]=DICH[g.d];const left=code[g.d]===L;g.scores.forEach(s=>{if(facetState(s,left)==="oops")k++})});
  return k;
}

/* ---------- who plays with whom ----------
   Derived, not hand-listed. Plays together = the three types that share your middle pair
   (NT / NF / ST / SF): the same read on the world, differing only in tempo or grip.
   Plays off  = three principled inversions, none of which can be a clan member.        */
const FLIP={E:"I",I:"E",S:"N",N:"S",T:"F",F:"T",J:"P",P:"J"};
const flipAt=(code,idx)=>code.split("").map((c,i)=>idx.includes(i)?FLIP[c]:c).join("");
function clanWhy(a,b){
  const e=a[0]!==b[0], j=a[3]!==b[3];
  if(e&&j)return "same read, opposite tempo and grip";
  if(e)return b[0]==="E"?"same read, said out loud":"same read, kept inside";
  if(j)return b[3]==="P"?"same read, looser grip":"same read, tighter grip";
  return "same read";
}
const CHEM={};
for(const code of CODES){
  CHEM[code]={
    together:CODES.filter(c=>c!==code&&c[1]===code[1]&&c[2]===code[2])
      .map(c=>({code:c,why:clanWhy(code,c)}))
      .sort((x,y)=>x.why.length-y.why.length),
    off:[
      {code:flipAt(code,[0,1,2,3]),why:"the inverse — nothing in common but the room"},
      {code:flipAt(code,[1,2]),why:"your working method, none of your values"},
      {code:flipAt(code,[2]),why:"your eyes, the opposite verdict"}
    ]
  };
}
function pairChem(a,b){
  if(a===b)return null;
  if(CHEM[a].together.some(o=>o.code===b))return "together";
  if(CHEM[a].off.some(o=>o.code===b))return "off";
  return null;
}

const ROSTER={};

const COMBOS=Object.keys(ROSTER);

function pick(a,r){return a[Math.floor(r()*a.length)]}
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function makeCast(n,rand){
  const combos=shuffled(COMBOS,rand),seen=new Set(),out=[];
  for(let pass=0;pass<2&&out.length<n;pass++){
    for(const combo of combos){
      if(out.length>=n)break;
      const options=shuffled(ROSTER[combo],rand).filter(o=>!seen.has(o.n));
      if(!options.length)continue;
      const c=options[0];
      seen.add(c.n);
      out.push({name:c.n,src:c.src,combo,code:combo.slice(0,4),ident:combo.slice(5)});
    }
  }
  return out;
}

/* ---------- plot: a scenario, cast from the people already on the board ---------- */
const CAT_HINT={
 "Person vs. Person":["rivalry","romance"],
 "Person vs. Self":[],
 "Person vs. Nature":["friendship","alliance"],
 "Person vs. Society":["friendship","devotion"],
 "Person vs. Supernatural / Fate":["devotion","mentorship"],
 "War & Large-Scale Conflict":["rivalry","alliance"],
 "Family & Domestic Conflict":["family"],
 "Workplace & Institutional Conflict":["alliance","power"],
 "Survival & Heist Conflicts":["alliance","power"]
};
function againstType(nd){
  const out=[];
  nd.prof.forEach(g=>{
    const [L,,,,pairs]=DICH[g.d];const left=nd.code[g.d]===L;
    g.scores.forEach((s,i)=>{if(facetState(s,left)==="oops")out.push({pole:s<0?pairs[i][0]:pairs[i][1],mag:Math.abs(s)})});
  });
  return out.sort((a,b)=>b.mag-a.mag);
}
function pickPair(cat,rand){
  if(!links.length)return null;
  const hint=CAT_HINT[cat]||[];
  const fit=links.filter(l=>hint.includes(l.t.k));
  const set=fit.length?fit:links;
  return set[Math.floor(rand()*set.length)];
}
const WHO=nd=>`<button class="who" data-id="${nd.id}">${esc(nd.name)}</button>`;

function composePlot(sc,register,rand){
  const line=register==="e"?sc.e:sc.s;
  const pair=pickPair(sc.c,rand);
  const A=pair?nodes[pair.a]:nodes[0], B=pair?nodes[pair.b]:nodes[1%nodes.length];
  const tie=pair?pair.t:null;
  const tieName=tie?tie.n.toLowerCase():"strangers";
  const others=nodes.filter(nd=>nd!==A&&nd!==B);
  const third=others.length?others[Math.floor(rand()*others.length)]:null;
  const lone=nodes.slice().sort((a,b)=>b.oops-a.oops||(rand()-.5))[0];
  const flaw=againstType(lone)[0];
  const pickOf=a=>a[Math.floor(rand()*a.length)];

  let cast;
  switch(sc.c){
    case "Person vs. Self":
      cast=pickOf([
        `${WHO(lone)} is carrying this one alone${flaw?`, and the ${flaw.pole.toLowerCase()} streak that runs against their ${lone.code} is exactly where it gets in`:""}.`,
        `It lands on ${WHO(lone)}. ${lone.oops} of their twenty facets already pull against type${flaw?` — the ${flaw.pole.toLowerCase()} one hardest`:""}, so there is no settled self to fall back on.`
      ]);break;
    case "Person vs. Nature":
      cast=pickOf([
        `It comes for all ${nodes.length} of them. ${WHO(A)} and ${WHO(B)} have to agree on what to do next, and they are ${tieName}.`,
        `Nobody is exempt. The decision falls to ${WHO(A)} and ${WHO(B)} — ${tieName} — while everyone else waits.`
      ]);break;
    case "Person vs. Society":
      cast=pickOf([
        `${WHO(A)} is the one who won't go along. ${WHO(B)}, ${tieName}, has to decide whether that is worth standing next to.`,
        `${WHO(A)} breaks ranks first. Everyone else, ${WHO(B)} included, finds out what their own position was.`
      ]);break;
    case "Person vs. Supernatural / Fate":
      cast=pickOf([
        `${WHO(A)} is the one it has settled on. ${WHO(B)} is the only one who believes them, which is what ${tieName} buys you.`,
        `It picks ${WHO(A)}. ${WHO(B)} — ${tieName} — sees it coming and is not listened to.`
      ]);break;
    case "War & Large-Scale Conflict":
      cast=pickOf([
        `The cast splits. ${WHO(A)} leads one side, ${WHO(B)} the other; they were ${tieName} right up to the first shot.`,
        `${WHO(A)} and ${WHO(B)} end up on opposite sides of it${third?`, and ${WHO(third)} has to pick`:""}. Being ${tieName} does not survive the map.`
      ]);break;
    case "Family & Domestic Conflict":
      cast=pickOf([
        `${WHO(A)} and ${WHO(B)} are at the middle of it — ${tieName}, now with something to divide.`,
        `It plays out between ${WHO(A)} and ${WHO(B)}. ${third?`${WHO(third)} is dragged in as a referee and does badly.`:"Nobody else gets to stay out of it."}`
      ]);break;
    case "Workplace & Institutional Conflict":
      cast=pickOf([
        `${WHO(A)} and ${WHO(B)} are ${tieName}, with the institution sitting between them.`,
        `${WHO(A)} is on one end of it and ${WHO(B)} on the other${third?`; ${WHO(third)} signs whatever is put in front of them`:""}.`
      ]);break;
    case "Survival & Heist Conflicts":
      cast=pickOf([
        `${WHO(A)}, ${WHO(B)}${third?` and ${WHO(third)}`:""} are the crew. ${WHO(A)} and ${WHO(B)} being ${tieName} is going to matter at the worst moment.`,
        `The job needs ${WHO(A)} and ${WHO(B)}, who are ${tieName}${third?`, plus ${WHO(third)}, who was available`:""}.`
      ]);break;
    default:
      cast=pickOf([
        `${WHO(A)} and ${WHO(B)} are on opposite ends of it, and they are already ${tieName}.`,
        `It puts ${WHO(A)} against ${WHO(B)}. They were ${tieName} before any of this started.`,
        `${WHO(A)} wants it. So does ${WHO(B)}, which ${tieName} did nothing to prevent.`
      ]);
  }
  return {sc,register,line,cast,
    plain:`${sc.c} — ${sc.n} (${register==="e"?"extreme":"silly"})\n${line}\n${cast.replace(/<[^>]+>/g,"")}`};
}

/* ---------- generation ---------- */
function shuffled(arr,rand){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}

function generate(seed){
  const rand=mulberry(seed===undefined?(Math.random()*1e9|0):seed);
  let n=+document.getElementById("cast").value;
  const dens=2.1;
  const cast=makeCast(n,rand);
  const cx=W/2||400,cy=H/2||300,R=Math.min(cx,cy)*0.55;
  nodes=cast.map((c,i)=>{
    const a=(i/cast.length)*Math.PI*2+rand()*0.4;
    // the profile is seeded from the character, so Batman scores the same every recast
    const prof=profileFor(c.code,mulberry(hash(c.name+"|"+c.combo)));
    return {id:i,name:c.name,src:c.src,code:c.code,ident:c.ident,combo:c.combo,
      arch:TYPES[c.code][0],blurb:TYPES[c.code][1],prof,oops:oopsCount(prof,c.code),
      x:cx+Math.cos(a)*R+(rand()-.5)*30,y:cy+Math.sin(a)*R+(rand()-.5)*30,vx:0,vy:0,r:27+rand()*5};
  });

  n=nodes.length;
  const pool=shuffled(TROPES.filter(t=>enabled.has(t.k)),rand);
  const maxPairs=n*(n-1)/2;
  const QUOTA={p:2,n:2,x:2};              // every web carries at least two of each temperature
  const need=Math.min(maxPairs,pool.length,6);
  const want=Math.max(need,Math.min(maxPairs,pool.length,Math.max(n-1,Math.round(n*dens))));

  // 1. the shape — a spine so nobody is stranded, then extra pairs up to `want`
  const taken=new Set(),order=shuffled(nodes.map(nd=>nd.id),rand),pairs=[];
  const addPair=(a,b)=>{
    if(a===b)return false;
    const key=a<b?a+":"+b:b+":"+a;
    if(taken.has(key))return false;
    taken.add(key);pairs.push([a,b]);return true;
  };
  for(let i=1;i<order.length;i++)addPair(order[i],order[Math.floor(rand()*i)]);
  let guard=0;
  while(pairs.length<want&&guard++<900)addPair(Math.floor(rand()*n),Math.floor(rand()*n));

  // 2. the tropes — fill the quota first, then let chemistry pick the rest
  const spent=new Set();
  const draw=vals=>{
    let avail=pool.filter(t=>!spent.has(t.i)&&(!vals||vals.includes(t.v)));
    if(!avail.length)avail=pool.filter(t=>!vals||vals.includes(t.v));
    if(!avail.length)return null;
    const t=avail[Math.floor(rand()*avail.length)];
    spent.add(t.i);
    return t;
  };
  const chemOf=pr=>pairChem(nodes[pr[0]].code,nodes[pr[1]].code);
  const left=shuffled(pairs,rand),out=[];
  for(const v of ["p","n","x"]){
    for(let k=0;k<QUOTA[v]&&left.length;k++){
      const t=draw([v]);
      if(!t)break;                        // the enabled kinds hold nothing of this temperature
      let i=left.findIndex(pr=>chemOf(pr)===(v==="p"?"together":"off"));
      if(i<0)i=0;
      out.push({pr:left.splice(i,1)[0],t});
    }
  }
  for(const pr of left){
    const c=chemOf(pr);
    const prefer=c==="together"?["p"]:c==="off"?["n","x"]:null;
    out.push({pr,t:(prefer&&rand()<0.8?draw(prefer):null)||draw(null)});
  }
  links=shuffled(out.filter(o=>o.t),rand).map(({pr,t})=>{
    const flip=t.d===1&&rand()<0.5;
    return {a:flip?pr[1]:pr[0],b:flip?pr[0]:pr[1],t,chem:chemOf(pr)};
  });
  selected=null;hovered=null;
  rollPlot();
  renderRail();
}

/* ---------- physics ---------- */
function step(){
  const n=nodes.length;if(!n)return;
  const cx=W/2,cy=H/2;
  const rest=Math.max(140,Math.min(W,H)*0.33);
  for(let i=0;i<n;i++){
    const a=nodes[i];
    // gentle pull to centre
    a.vx+=(cx-a.x)*0.00055;
    a.vy+=(cy-a.y)*0.00055;
    if(!reduce){a.vx+=(Math.random()-.5)*0.035;a.vy+=(Math.random()-.5)*0.035;}
    for(let j=i+1;j<n;j++){
      const b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01;
      const ux=dx/d,uy=dy/d;
      // inverse-square repulsion
      const rep=Math.min(2.4,14000/(d*d));
      a.vx-=ux*rep;a.vy-=uy*rep;b.vx+=ux*rep;b.vy+=uy*rep;
      // hard separation so spheres never overlap labels
      const sep=a.r+b.r+78;
      if(d<sep){
        const push=(sep-d)*0.055;
        a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;
      }
    }
  }
  for(const l of links){
    const a=nodes[l.a],b=nodes[l.b];
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01;
    const f=(d-rest)*0.0022;
    const ux=dx/d,uy=dy/d;
    a.vx+=ux*f;a.vy+=uy*f;b.vx-=ux*f;b.vy-=uy*f;
  }
  const pad=58,damp=reduce?0.72:0.86;
  for(const a of nodes){
    if(a===dragging){a.vx=a.vy=0;continue}
    a.vx*=damp;a.vy*=damp;
    const sp=Math.hypot(a.vx,a.vy);
    if(sp>6){a.vx*=6/sp;a.vy*=6/sp}
    a.x+=a.vx;a.y+=a.vy;
    if(a.x<pad){a.x=pad;a.vx=Math.abs(a.vx)*.4}
    if(a.x>W-pad){a.x=W-pad;a.vx=-Math.abs(a.vx)*.4}
    if(a.y<pad){a.y=pad;a.vy=Math.abs(a.vy)*.4}
    if(a.y>H-pad-10){a.y=H-pad-10;a.vy=-Math.abs(a.vy)*.4}
  }
}

function wavy(x1,y1,x2,y2,amp,wl){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const ux=dx/len,uy=dy/len,px=-uy,py=ux;
  const steps=Math.max(10,Math.round(len/3));
  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    const t=i/steps,d=t*len;
    const taper=Math.sin(Math.PI*t);
    const off=Math.sin(d/wl*Math.PI*2)*amp*taper;
    const x=x1+ux*d+px*off,y=y1+uy*d+py*off;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();
}
function head(x,y,ux,uy,s,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(uy,ux));
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-s,s*0.46);ctx.lineTo(-s*0.72,0);ctx.lineTo(-s,-s*0.46);
  ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore();
}

const TIE_FONT='500 11px "IBM Plex Mono", ui-monospace, monospace';

/* the stack of text under a sphere: name (wrapped to two lines if long), then source */
function nameStack(nd){
  ctx.font=NAME_FONT;
  const words=nd.name.split(" ");
  let lines=[nd.name];
  if(ctx.measureText(nd.name).width>136&&words.length>1){
    const mid=Math.ceil(words.length/2);
    lines=[words.slice(0,mid).join(" "),words.slice(mid).join(" ")];
  }
  const out=lines.map((txt,i)=>({txt,font:NAME_FONT,col:C.ink,y:nd.y+nd.r+8+i*16,w:ctx.measureText(txt).width}));
  ctx.font=SRC_FONT;
  out.push({txt:nd.src,font:SRC_FONT,col:C.faint,y:nd.y+nd.r+9+lines.length*16,w:ctx.measureText(nd.src).width});
  return out;
}
const overlaps=(A,B)=>!(A.x+A.w<B.x||B.x+B.w<A.x||A.y+A.h<B.y||B.y+B.h<A.y);

function draw(){
  ctx.clearRect(0,0,W,H);
  const focus=selected!=null?selected:(hovered&&hovered.kind==="node"?hovered.id:null);
  const hoverLink=hovered&&hovered.kind==="link"?hovered.id:null;
  const isDim=nd=>focus!=null&&nd.id!==focus&&!links.some(l=>(l.a===focus&&l.b===nd.id)||(l.b===focus&&l.a===nd.id));

  // --- lines and arrowheads ---
  const pending=[];
  links.forEach((l,li)=>{
    const a=nodes[l.a],b=nodes[l.b];
    const touched=focus==null||l.a===focus||l.b===focus;
    const hot=li===hoverLink||(focus!=null&&touched);
    const alpha=focus==null?1:(touched?1:0.16);
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const ux=dx/d,uy=dy/d;
    const gap=9;
    const x1=a.x+ux*(a.r+gap),y1=a.y+uy*(a.r+gap);
    const x2=b.x-ux*(b.r+gap),y2=b.y-uy*(b.r+gap);
    const col=vcol(l.t.v);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.strokeStyle=col;
    ctx.lineWidth=hot?2.6:1.9;
    ctx.lineCap="round";
    const ax=x2-ux*10,ay=y2-uy*10,bx=x1+ux*10,by=y1+uy*10;
    if(l.t.v==="n"){ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ax,ay);ctx.stroke();ctx.setLineDash([]);}
    else if(l.t.v==="x"){wavy(l.t.d===2?bx:x1,l.t.d===2?by:y1,ax,ay,4.6,26);}
    else {ctx.beginPath();ctx.moveTo(l.t.d===2?bx:x1,l.t.d===2?by:y1);ctx.lineTo(ax,ay);ctx.stroke();}
    head(x2,y2,ux,uy,10,col);
    if(l.t.d===2)head(x1,y1,-ux,-uy,10,col);
    ctx.restore();
    if(focus==null||touched){
      ctx.font=TIE_FONT;
      pending.push({li,txt:l.t.n,mx:(x1+x2)/2,my:(y1+y2)/2,
        w:ctx.measureText(l.t.n).width+12,h:16,dy:0,col:hot?col:C.faint,alpha:alpha*(hot?1:0.9)});
    }
  });

  // --- what a tie label must not land on: the spheres and their name stacks ---
  const fixed=[];
  nodes.forEach(nd=>{
    fixed.push({x:nd.x-nd.r,y:nd.y-nd.r,w:nd.r*2,h:nd.r*2});
    nameStack(nd).forEach(s=>fixed.push({x:nd.x-s.w/2-5,y:s.y-2,w:s.w+10,h:15}));
  });

  // --- place the labels: leftmost stays put; anything further right, or level but
  //     further up, is the one that steps up until it has clear air ---
  const boxOf=L=>({x:L.mx-L.w/2,y:L.my-L.h/2+L.dy,w:L.w,h:L.h});
  pending.sort((a,b)=>(a.mx-b.mx)||(b.my-a.my));
  const settled=[];
  // offsets tried in order of preference: stay, then step up, then down as a last resort
  const OFFSETS=[0];
  for(let k=1;k<=20;k++)OFFSETS.push(-5*k);
  for(let k=1;k<=10;k++)OFFSETS.push(5*k);
  const collisions=L=>{
    const box=boxOf(L);
    let n=0;
    for(const f of fixed)if(overlaps(box,f))n++;
    for(const s of settled)if(overlaps(box,boxOf(s)))n++;
    return n;
  };
  for(const L of pending){
    let best=null;
    for(const dy of OFFSETS){
      L.dy=dy;
      const n=collisions(L);
      if(n===0){best=dy;break}
      if(best===null||n<best.n)best={dy,n};
    }
    L.dy=typeof best==="number"?best:best.dy;  // nowhere clear: the least-crowded spot
    settled.push(L);
  }
  labelBoxes=settled.map(L=>({li:L.li,...boxOf(L)}));

  // --- draw the labels, with a leader back to the line for any that moved ---
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const L of settled){
    ctx.save();
    ctx.globalAlpha=L.alpha;
    const y=L.my+L.dy;
    if(Math.abs(L.dy)>3){
      ctx.strokeStyle=L.col;
      ctx.globalAlpha=L.alpha*0.35;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(L.mx,L.my);ctx.lineTo(L.mx,y+(L.dy<0?L.h/2-1:1-L.h/2));ctx.stroke();
      ctx.globalAlpha=L.alpha;
    }
    ctx.fillStyle=C.bg;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(L.mx-L.w/2,y-L.h/2,L.w,L.h,8);else ctx.rect(L.mx-L.w/2,y-L.h/2,L.w,L.h);
    ctx.fill();
    ctx.font=TIE_FONT;
    ctx.fillStyle=L.col;
    ctx.fillText(L.txt,L.mx,y+0.5);
    ctx.restore();
  }

  // --- spheres ---
  nodes.forEach(nd=>{
    const dim=isDim(nd);
    ctx.save();
    ctx.globalAlpha=dim?0.22:1;
    const g=ctx.createRadialGradient(nd.x-nd.r*0.38,nd.y-nd.r*0.44,nd.r*0.12,nd.x,nd.y,nd.r*1.15);
    const base=C.sphere;
    g.addColorStop(0,"rgba(255,255,255,.55)");
    g.addColorStop(0.42,base);
    g.addColorStop(1,"rgba(0,0,0,.32)");
    ctx.beginPath();ctx.arc(nd.x,nd.y,nd.r,0,Math.PI*2);
    ctx.fillStyle=base;ctx.fill();
    ctx.fillStyle=g;ctx.fill();
    if(nd.id===focus){
      ctx.lineWidth=2;ctx.strokeStyle=C.ink;ctx.stroke();
      ctx.beginPath();ctx.arc(nd.x,nd.y,nd.r+6,0,Math.PI*2);
      ctx.lineWidth=1;ctx.strokeStyle=C.faint;ctx.stroke();
    }
    // type code inside the sphere
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font='500 11px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillStyle="rgba(255,255,255,.95)";
    ctx.fillText(nd.code,nd.x,nd.y-5);
    ctx.font='500 9.5px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillStyle=nd.ident==="T"?"rgba(255,255,255,.62)":"rgba(255,255,255,.88)";
    ctx.fillText(nd.ident==="T"?"turbulent":"assertive",nd.x,nd.y+8);

    // name, then source — same measurements the label placement used
    ctx.textBaseline="top";
    nameStack(nd).forEach(s=>{
      ctx.font=s.font;
      ctx.fillStyle=C.bg;
      ctx.globalAlpha=(dim?0.22:1)*0.88;
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(nd.x-s.w/2-5,s.y-2,s.w+10,15,5);ctx.fill();}
      ctx.globalAlpha=dim?0.22:1;
      ctx.fillStyle=s.col;
      ctx.fillText(s.txt,nd.x,s.y);
    });
    ctx.restore();
  });
}

/* ---------- loop ---------- */
function frame(){step();draw();requestAnimationFrame(frame)}

/* ---------- sizing ---------- */
function resize(){
  const r=stage.getBoundingClientRect();
  W=Math.max(200,r.width);H=Math.max(200,r.height);
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(stage);

/* ---------- hit testing & interaction ---------- */
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function nodeAt(p){
  for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];if(Math.hypot(n.x-p.x,n.y-p.y)<=n.r+4)return n}
  return null;
}
function linkAt(p){
  // a label that stepped up to avoid a collision is still the way to reach its tie
  for(const b of labelBoxes)
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b.li;
  for(let i=0;i<links.length;i++){
    const a=nodes[links[i].a],b=nodes[links[i].b];
    const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
    let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));
    if(d<10)return i;
  }
  return -1;
}
function showTip(p,html){
  if(!tipEl){tipEl=document.createElement("div");tipEl.className="tip";stage.appendChild(tipEl)}
  tipEl.innerHTML=html;
  tipEl.style.left=Math.max(120,Math.min(W-120,p.x))+"px";
  tipEl.style.top=(p.y-14)+"px";
  tipEl.hidden=false;
}
function hideTip(){if(tipEl)tipEl.hidden=true}

cv.addEventListener("pointerdown",e=>{
  const p=pt(e),n=nodeAt(p);
  if(n){dragging=n;cv.setPointerCapture(e.pointerId);cv.classList.add("dragging")}
});
cv.addEventListener("pointermove",e=>{
  const p=pt(e);
  if(dragging){dragging.x=p.x;dragging.y=p.y;return}
  const n=nodeAt(p);
  if(n){
    hovered={kind:"node",id:n.id};
    const ties=links.filter(l=>l.a===n.id||l.b===n.id).length;
    showTip(p,`<strong>${esc(n.name)}</strong>${n.combo} · ${esc(n.arch)} · ${esc(n.src)}<div class="roles">${ties} tie${ties===1?"":"s"} · ${n.oops} out-of-preference facet${n.oops===1?"":"s"} — ${document.body.classList.contains("bare")?"F2 for the profile":"click to open"}</div>`);
    return;
  }
  const li=linkAt(p);
  if(li>=0){
    hovered={kind:"link",id:li};
    const l=links[li],t=l.t;
    showTip(p,`<strong>${esc(t.n)}</strong>${esc(t.g)}<div class="roles">${esc(nodes[l.a].name)} (${esc(t.a)}) ${t.d===2?"⇄":"→"} ${esc(nodes[l.b].name)} (${esc(t.b)})</div>`);
    return;
  }
  hovered=null;hideTip();
});
cv.addEventListener("pointerup",e=>{
  if(dragging){cv.classList.remove("dragging");dragging=null;return}
  const p=pt(e),n=nodeAt(p);
  selected=n?(selected===n.id?null:n.id):null;
  renderRail();
});
cv.addEventListener("pointerleave",()=>{hovered=null;hideTip()});

/* ---------- rail ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function tieRow(l){
  const t=l.t,A=nodes[l.a].name,B=nodes[l.b].name;
  const arrow=t.d===2?"⇄":"→";
  return `<li><button class="tie" data-a="${l.a}" data-b="${l.b}">
    <span class="pair"><span>${esc(A)}</span><span class="arrow v-${t.v}">${arrow}</span><span>${esc(B)}</span></span>
    <span class="name">${esc(t.n)}</span>
    <span class="gloss">${esc(t.g)} <span class="v-${t.v}">· ${t.v==="p"?"warm":t.v==="n"?"hostile":"complicated"}${t.d===1?", one-way":""}</span>${l.chem?` <span class="chemtag ${l.chem==="together"?"c-with":"c-against"}">${nodes[l.a].code}/${nodes[l.b].code} plays ${l.chem}</span>`:""}</span>
  </button></li>`;
}
function castRow(nd){
  return `<li><button class="tie castline" data-a="${nd.id}" data-b="${nd.id}">
    <span class="pair"><span class="code">${nd.combo}</span><span class="name" style="font-size:13.5px">${esc(nd.name)}</span></span>
    <span class="gloss"><span class="arch">${esc(nd.arch)}</span> · ${esc(nd.src)}${nd.oops?` · <span class="v-x">${nd.oops} against type</span>`:""}</span>
  </button></li>`;
}
function identityRow(nd){
  const turb=nd.ident==="T";
  return `<section class="dich identity">
    <h3><span class="letter">${nd.ident}</span>${turb?"Turbulent":"Assertive"}<span class="flag">identity, not a Step II facet</span></h3>
    <div class="facet s-${turb?"oops":"in"}">
      <span class="poles"><span class="${turb?"":"on"}">Assertive</span><span class="${turb?"on":""}">Turbulent</span></span>
      <span class="track"><i style="left:${turb?78:22}%"></i></span>
    </div>
    <p class="identnote">${turb?"Self-doubting, driven by the gap between what they are and what they meant to be.":"Even-keeled, largely untroubled by having been wrong."}</p>
  </section>`;
}
function facetBlock(nd){
  return nd.prof.map(g=>{
    const [L,R,LN,RN,pairs]=DICH[g.d];
    const left=nd.code[g.d]===L;
    const rows=g.scores.map((s,i)=>{
      const st=facetState(s,left);
      const pct=((s+5)/10*100).toFixed(1);
      return `<div class="facet s-${st}" title="${esc(pairs[i][0])} vs ${esc(pairs[i][1])}">
        <span class="poles"><span class="${s<0?"on":""}">${esc(pairs[i][0])}</span><span class="${s>0?"on":""}">${esc(pairs[i][1])}</span></span>
        <span class="track"><i style="left:${pct}%"></i></span>
      </div>`;
    }).join("");
    const outs=g.scores.filter(s=>facetState(s,left)==="oops").length;
    return `<section class="dich">
      <h3><span class="letter">${nd.code[g.d]}</span>${esc(nd.code[g.d]===L?LN:RN)}${outs?`<span class="flag">${outs} against type</span>`:""}</h3>
      ${rows}
    </section>`;
  }).join("");
}
function chemBlock(nd){
  const onBoard=code=>nodes.filter(o=>o.id!==nd.id&&o.code===code);
  const row=(o,cls)=>{
    const here=onBoard(o.code);
    return `<div class="chemrow ${cls}${here.length?" here":""}">
      <span class="ccode">${o.code}</span>
      <span class="cwhy">${esc(o.why)}</span>
      ${here.length?`<span class="chere">${here.map(h=>`<button class="who" data-id="${h.id}">${esc(h.name)}</button>`).join(", ")}</span>`:""}
    </div>`;
  };
  const C2=CHEM[nd.code];
  return `<h3 class="railhead">Plays together <span class="hint">${nd.code} clan</span></h3>
    ${C2.together.map(o=>row(o,"c-with")).join("")}
    <h3 class="railhead">Plays off</h3>
    ${C2.off.map(o=>row(o,"c-against")).join("")}`;
}
function renderRail(){
  if(selected==null){
    const counts={p:0,n:0,x:0};links.forEach(l=>counts[l.t.v]++);
    rail.innerHTML=`<h2>The whole tangle</h2>
      <p class="sub">${nodes.length} characters · ${links.length} ties · ${counts.p} warm / ${counts.n} hostile / ${counts.x} complicated</p>
      <h3 class="railhead">Cast</h3>
      <ul class="ties">${nodes.map(castRow).join("")}</ul>
      <h3 class="railhead">Ties</h3>
      <ul class="ties">${links.map(tieRow).join("")}</ul>`;
  }else{
    const me=nodes[selected];
    const mine=links.filter(l=>l.a===selected||l.b===selected);
    rail.innerHTML=`<button class="backlink" id="back">← the whole tangle</button>
      <h2>${esc(me.name)}</h2>
      <p class="sub">${me.combo} · ${esc(me.arch)}</p>
      <p class="source">${esc(me.src)} · ${mine.length} tie${mine.length===1?"":"s"}</p>
      <p class="blurb">${esc(me.blurb)}</p>
      ${chemBlock(me)}
      <h3 class="railhead">Step II profile <span class="hint">${me.oops} of 20 against type</span></h3>
      ${facetBlock(me)}
      ${identityRow(me)}
      <h3 class="railhead">Ties</h3>
      ${mine.length?`<ul class="ties">${mine.map(tieRow).join("")}</ul>`:`<p class="empty">Unconnected — drag the cast slider or recast.</p>`}`;
    rail.querySelector("#back").addEventListener("click",()=>{selected=null;renderRail()});
  }
  rail.querySelectorAll(".who").forEach(b=>b.addEventListener("click",ev=>{
    ev.stopPropagation();selected=+b.dataset.id;renderRail();rail.scrollTop=0;
  }));
  rail.querySelectorAll(".tie").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const a=+btn.dataset.a;
      selected=selected===a?+btn.dataset.b:a;
      renderRail();
    });
  });
}

/* ---------- controls ---------- */
const castEl=document.getElementById("cast"),castN=document.getElementById("castN");
castEl.addEventListener("input",()=>{castN.textContent=castEl.value;generate()});
document.getElementById("roll").addEventListener("click",()=>generate());
document.getElementById("replot").addEventListener("click",()=>rollPlot());
document.getElementById("register").addEventListener("change",()=>rollPlot());
document.getElementById("copy").addEventListener("click",async e=>{
  const roster=nodes.map(n=>{
    const outs=[];
    n.prof.forEach(g=>{
      const [L,,,,pairs]=DICH[g.d];const left=n.code[g.d]===L;
      g.scores.forEach((s,i)=>{if(facetState(s,left)==="oops")outs.push(s<0?pairs[i][0]:pairs[i][1])});
    });
    return `${n.name} (${n.src}) — ${n.combo}, ${n.arch}\n    ${n.blurb}\n    against type: ${outs.length?outs.join(", "):"none"}\n    plays together: ${CHEM[n.code].together.map(o=>o.code).join(", ")}\n    plays off: ${CHEM[n.code].off.map(o=>o.code).join(", ")}`;
  }).join("\n");
  const web=links.map(l=>`${nodes[l.a].name} ${l.t.d===2?"<->":"->"} ${nodes[l.b].name}  |  ${l.t.n} (${l.t.a} / ${l.t.b})  —  ${l.t.g}`).join("\n");
  const txt=`PREMISE\n${plot?plot.plain:"—"}\n\nCAST\n${roster}\n\nTIES\n${web}\n`;
  const btn=e.currentTarget;
  try{await navigator.clipboard.writeText(txt);btn.textContent="Copied";}
  catch{btn.textContent="Clipboard blocked";}
  setTimeout(()=>btn.textContent="Copy as text",1600);
});
const chromeBtn=document.getElementById("chromeToggle");
function setBare(on){
  document.body.classList.toggle("bare",on);
  chromeBtn.setAttribute("aria-pressed",String(!on));
  chromeBtn.firstChild.nodeValue=on?"panels ":"hide ";
  chromeBtn.title=on?"Show the premise, controls and profiles (F2)":"Back to the web alone (F2)";
  resize();
}
chromeBtn.addEventListener("click",()=>setBare(!document.body.classList.contains("bare")));
addEventListener("keydown",e=>{
  if(e.key==="F2"){e.preventDefault();setBare(!document.body.classList.contains("bare"));return}
  if(e.key==="Escape"&&selected!=null){selected=null;renderRail()}
});

/* ---------- boot ---------- */
readTokens();
setBare(true);
resize();
generate();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readTokens);
new MutationObserver(readTokens).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
</script>

</body>
