<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{color-scheme:light}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Location Tangle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen map. The web fills the stage; F2 brings the masthead, controls and rail back. */
:root{
  --bg:#eef0f3;--panel:#f8f9fb;--ink:#1a1d24;--ink-soft:#5a6170;--ink-faint:#8d93a1;
  --rule:#d3d7df;--rule-soft:#e3e6ec;--pos:#1f7a5e;--neg:#b22f45;--cpx:#9a6a12;
  --sphere:#5d6a86;--focus:#2f5fd0;--shadow:rgba(26,29,36,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116;--panel:#161a21;--ink:#e8eaef;--ink-soft:#a0a7b6;--ink-faint:#6e7686;
    --rule:#2a303b;--rule-soft:#20252e;--pos:#4ecfa3;--neg:#ff7183;--cpx:#e8b155;
    --sphere:#7d88a6;--focus:#7aa2ff;--shadow:rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1116;--panel:#161a21;--ink:#e8eaef;--ink-soft:#a0a7b6;--ink-faint:#6e7686;
  --rule:#2a303b;--rule-soft:#20252e;--pos:#4ecfa3;--neg:#ff7183;--cpx:#e8b155;
  --sphere:#7d88a6;--focus:#7aa2ff;--shadow:rgba(0,0,0,.45);color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
.masthead{
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding-block:10px 9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--rule);background:var(--panel);
}
.wordmark{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:19px;letter-spacing:-.015em;margin:0}
.wordmark em{font-style:italic;font-weight:600;color:var(--ink-soft)}
.tagline{font-size:12px;color:var(--ink-soft);margin:0;max-width:56ch;line-height:1.45}

.controls{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--rule);background:var(--panel);
}
button{
  font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--bg);
  border:1px solid var(--rule);border-radius:3px;padding:5px 10px;cursor:pointer;
}
button:hover{border-color:var(--ink-faint)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.primary{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:600}
.primary:hover{background:var(--ink-soft);border-color:var(--ink-soft)}

.workspace{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}

body.bare .masthead,body.bare .controls,body.bare .rail{display:none}
body.bare .workspace{grid-template-columns:1fr}

.chrome-toggle{
  position:absolute;z-index:6;
  top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:6px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);background:color-mix(in srgb,var(--panel) 80%,transparent);
  border:1px solid var(--rule-soft);border-radius:999px;padding:5px 10px;backdrop-filter:blur(6px);
}
.chrome-toggle:hover{color:var(--ink);border-color:var(--rule)}
.chrome-toggle kbd{font-family:inherit;font-size:9.5px;border:1px solid var(--rule);border-radius:3px;padding:1px 4px;color:var(--ink-soft)}

.legend{
  position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:14px;
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--rule-soft);border-radius:4px;
  padding:9px 11px;display:grid;gap:5px;backdrop-filter:blur(6px);pointer-events:none;
}
.legend h2{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 2px;font-weight:500}
.legend .row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-soft)}
.legend svg{display:block;flex:none}

.tip{
  position:absolute;pointer-events:none;max-width:250px;background:var(--ink);color:var(--panel);
  border-radius:4px;padding:7px 9px;font-size:11.5px;line-height:1.4;box-shadow:0 6px 18px var(--shadow);
  transform:translate(-50%,-115%);z-index:5;
}
.tip strong{display:block;font-family:"Fraunces",Georgia,serif;font-size:13px;font-weight:600;margin-bottom:2px}
.tip .roles{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.04em;opacity:.75;margin-top:3px}

.rail{
  border-left:1px solid var(--rule);background:var(--panel);overflow-y:auto;min-height:0;
  padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.rail h2{font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:600;margin:0 0 2px;text-wrap:balance}
.rail .sub{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 10px}
.backlink{font-size:11.5px;color:var(--focus);background:none;border:none;padding:0 0 10px;cursor:pointer}
.railhead{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:500;margin:18px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--rule-soft);
  display:flex;justify-content:space-between;gap:8px;align-items:baseline;
}
.railhead .hint{letter-spacing:.02em;text-transform:none;font-size:10px}
.blurb{font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 4px}
.terrain{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;color:var(--ink-faint);margin:0 0 10px}

.list{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--rule-soft)}
.list li{background:var(--panel);padding:9px 0}
.item{width:100%;text-align:left;background:none;border:none;padding:0;cursor:pointer;display:grid;gap:3px;border-radius:0}
.item:hover .iname{text-decoration:underline;text-underline-offset:2px}
.item:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.iname{font-family:"Fraunces",Georgia,serif;font-size:14px;font-weight:600;color:var(--ink);line-height:1.25}
.imeta{font-size:11.5px;color:var(--ink-faint);line-height:1.45}
.pair{font-size:12px;color:var(--ink-soft);display:flex;gap:5px;align-items:baseline;flex-wrap:wrap}
.arrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500}
.code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--panel);background:var(--sphere);border-radius:3px;padding:2px 5px}
.v-p{color:var(--pos)}.v-n{color:var(--neg)}.v-x{color:var(--cpx)}
.chemtag{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;letter-spacing:.04em}
.empty{font-size:12px;color:var(--ink-faint);line-height:1.5}

.radar{width:100%;max-width:300px;height:auto;display:block;margin:6px auto 2px}
.radar .ring{fill:none;stroke:var(--rule-soft);stroke-width:1}
.radar .axis{stroke:var(--rule);stroke-width:1}
.radar .shape{fill:var(--sphere);fill-opacity:.28;stroke:var(--ink);stroke-width:1.6}
.radar .dot{fill:var(--ink)}
.radar .axlab{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;fill:var(--ink-soft)}
.radar .axnum{fill:var(--ink);font-weight:600}

.bar{display:grid;gap:4px;margin-bottom:9px}
.bar .bl{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-soft)}
.bar .bl b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar .track{height:5px;border-radius:3px;background:var(--rule-soft);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--sphere)}
.bar.lead .track i{background:var(--ink)}

.leader{font-size:12px;line-height:1.45;color:var(--ink-soft);padding:6px 0;border-bottom:1px solid var(--rule-soft)}
.leader b{color:var(--ink);font-weight:600}

.grp{margin:0 0 12px}
.grp h3{display:flex;align-items:baseline;gap:7px;margin:10px 0 5px;font-size:11.5px;font-weight:600;color:var(--ink-soft)}
.grp h3 .pole{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;font-weight:400;color:var(--ink-faint);margin-left:auto}
.grp h3 .pole .on{color:var(--ink);font-weight:600}
.fac{display:grid;grid-template-columns:70px 1fr;gap:1px 8px;font-size:11.5px;line-height:1.4;padding:3px 0;border-bottom:1px dotted var(--rule-soft)}
.fac .fn{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;color:var(--ink-faint);letter-spacing:.02em;padding-top:1px}
.fac .ft{color:var(--ink-soft)}
.fac.off .ft{color:var(--cpx)}
.fac .dot{color:var(--pos);margin-right:3px}
.keyline{font-size:10.5px;color:var(--ink-faint);margin:0 0 4px;line-height:1.5}

@media (max-width:860px){
  .workspace{grid-template-columns:1fr;grid-template-rows:minmax(44vh,1fr) minmax(0,40%)}
  body.bare .workspace{grid-template-rows:1fr}
  .rail{border-left:none;border-top:1px solid var(--rule)}
  .legend{right:max(14px,env(safe-area-inset-right,0px));left:auto;bottom:10px;padding:7px 9px}
  .legend .row{font-size:10px}
}
@media (max-width:520px){.tagline{display:none}}
</style>

</head>
<body>
<header class="masthead">
  <h1 class="wordmark">Location <em>Tangle</em></h1>
  <p class="tagline">Six regions, each with a dominant faction and a terrain that explains it. Drag any region. Click one to read its ground.</p>
</header>

<div class="controls">
  <button class="primary" id="retie">Retie</button>
  <button id="copy">Copy as text</button>
</div>

<main class="workspace">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <button class="chrome-toggle" id="chromeToggle" aria-pressed="false"><span>panels </span><kbd>F2</kbd></button>
    <div class="legend">
      <h2>Reading the lines</h2>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><line x1="1" y1="5" x2="39" y2="5" stroke="var(--pos)" stroke-width="2"/></svg> mostly warm</div>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><line x1="1" y1="5" x2="39" y2="5" stroke="var(--neg)" stroke-width="2" stroke-dasharray="7 5"/></svg> mostly hostile</div>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><path d="M1 5 q5 -4 10 0 t10 0 t10 0 t8 0" fill="none" stroke="var(--cpx)" stroke-width="2"/></svg> complicated</div>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><line x1="1" y1="5" x2="32" y2="5" stroke="currentColor" stroke-width="1.6"/><path d="M39 5 L31 1.6 L31 8.4 Z" fill="currentColor"/></svg> one-way</div>
      <div class="row"><svg width="40" height="10" aria-hidden="true"><line x1="8" y1="5" x2="32" y2="5" stroke="currentColor" stroke-width="1.6"/><path d="M39 5 L31 1.6 L31 8.4 Z" fill="currentColor"/><path d="M1 5 L9 1.6 L9 8.4 Z" fill="currentColor"/></svg> mutual</div>
    </div>
  </div>
  <aside class="rail" id="rail"></aside>
</main>

<script>
/* =====================================================================
   DATA — pure, no DOM. Everything above the "state" marker is testable.
   ===================================================================== */

/* the 20 Step II facets, in order: four dichotomies, five facets each */
const FACETS=["Roads","Borders","Tongues","Ports","Strangers",
              "Soil","Water","Ore","Forage","Season",
              "Law","Arms","Coin","Record","Justice",
              "Ruins","Grudges","Faith","Blood","Names"];
const GROUPS=[
  {name:"Contact",  letter:0,from:0 ,poles:{P:"Passable",S:"Sealed"}},
  {name:"Yield",    letter:1,from:5 ,poles:{G:"Giving",W:"Withholding"}},
  {name:"Order",    letter:2,from:10,poles:{R:"Ruled",U:"Unruled"}},
  {name:"Memory",   letter:3,from:15,poles:{O:"Old",N:"New"}}
];

/* which stat each facet feeds. A region's stat = how many of its facets that feed
   the stat show the trait (third field of each facet), mapped onto 1–5. */
const TAGS={
  Roads:["trade","open"],Borders:["trade","open"],Tongues:["trade","open"],Ports:["trade","open"],Strangers:["aggr","open"],
  Soil:["yield"],Water:["yield","trade"],Ore:["yield","trade"],Forage:["yield"],Season:["yield"],
  Law:["stab"],Arms:["aggr","stab"],Coin:["trade","stab"],Record:["stab"],Justice:["aggr","stab"],
  Ruins:["anti"],Grudges:["aggr","anti"],Faith:["anti"],Blood:["aggr","anti"],Names:["anti"]
};
const STATS=[["aggr","Aggression","Most aggressive"],["trade","Trade","Best trade"],["stab","Stability","Most stable"],
             ["yield","Yield","Richest land"],["anti","Antiquity","Oldest"],["open","Openness","Most open"]];
const TOTAL={};
STATS.forEach(([k])=>{TOTAL[k]=FACETS.filter(f=>(TAGS[f]||[]).includes(k)).length});

/* the tie library. [name, gloss, valence, directedness, category]
   valence p = warm, n = hostile, x = complicated. d 1 = one-way, 2 = mutual. */
const TIE_LIB=[
 {n:"Monopoly at the Gate",g:"One toll house stands between the valley and the sea.",v:"n",d:1,c:"Trade & dependency"},
 {n:"Uneasy Allies",g:"Trade and mutual defence, each one drafting the other's end.",v:"x",d:2,c:"Trade & dependency"},
 {n:"Trade Compact",g:"Tariffs agreed jointly and kept honest by both.",v:"p",d:2,c:"Trade & dependency"},
 {n:"Road Lifeline",g:"The one road is a lifeline at one end and a nuisance at the other.",v:"x",d:1,c:"Infrastructure"},
 {n:"Watershed",g:"Upstream holds the water; downstream holds the grudge.",v:"n",d:1,c:"Infrastructure"},
 {n:"Dammed Rivals",g:"Two cities fighting over the same sluice gate.",v:"x",d:2,c:"Infrastructure"},
 {n:"Stolen Water",g:"Diversions that quietly dry out the valley below.",v:"n",d:1,c:"Infrastructure"},
 {n:"Tribute Uphill",g:"The coast pays the highlands for passage, every season.",v:"n",d:1,c:"Vassalage & tribute"},
 {n:"Subject Province",g:"Formally a holding, practically a farm.",v:"n",d:1,c:"Vassalage & tribute"},
 {n:"Old Charter",g:"Shared law from a treaty nobody has read since it was signed.",v:"p",d:2,c:"Blood & history"},
 {n:"Blood Feud",g:"Three generations of raids across the same line.",v:"n",d:2,c:"Blood & history"},
 {n:"Buried Claim",g:"A title dug out of the ruins that both sides now cite.",v:"n",d:1,c:"Blood & history"},
 {n:"Sister Settlements",g:"Founded from one clan and still ceremonially sisters.",v:"p",d:2,c:"Kinship & diaspora"},
 {n:"Remittance",g:"Money flows back to the homeland. Nothing flows out.",v:"p",d:1,c:"Kinship & diaspora"},
 {n:"Pilgrim's Road",g:"Shrine tithes and pilgrims run one way, always.",v:"p",d:1,c:"Faith & pilgrimage"},
 {n:"Schism Border",g:"Faith drew this line before the army did.",v:"n",d:2,c:"Faith & pilgrimage"},
 {n:"Refugee Corridor",g:"The people arriving are the only thing moving that way.",v:"p",d:1,c:"Migration & refuge"},
 {n:"Smuggler's Line",g:"A border with more business on it than the customs office.",v:"x",d:2,c:"Migration & refuge"},
 {n:"Irredentist Claim",g:"The neighbour's dominant faction claims this one's minority.",v:"n",d:1,c:"Border & territory"},
 {n:"Contested Ferry",g:"One ferry, two owners, both holding paperwork.",v:"x",d:2,c:"Border & territory"},
 {n:"Garrison Pact",g:"Mutual protection, each garrison answering to the other's captain.",v:"p",d:2,c:"Border & territory"},
 {n:"Craft Monopoly",g:"Ore leaves one way; finished goods come back at ten times the price.",v:"x",d:1,c:"Craft & monopoly"}
];

/* the six regions. f = the twenty facets as [text, against-letter, shows-the-stat-trait].
   against-letter: the facet runs against the region's four-letter code (amber in the rail).
   shows-the-trait: counts toward the spider stats its tags name. */
const REGIONS=[
 {code:"PWRO",name:"Caldmarch",arch:"Toll",terrain:"Upland pass",
  blurb:"A three-day corridor of switchback road through barrow country, older than any name on its gates. Twelve tollhouses, two garrison towns, and no reason to live there except the road.",
  sway:[["Warden's Office",54],["Hollow Syndicate",29],["Rime Chapter",17]],
  f:[["paved, switchbacked",0,1],["open gates",0,1],["polyglot",0,1],["landlocked",1,0],["marked, watched",1,0],
     ["thin",0,0],["running, never freezes",1,1],["worked out",0,0],["picked over",0,0],["short",0,0],
     ["courts",0,1],["standing garrisons",0,1],["minted",0,1],["written",0,1],["settled privately",1,0],
     ["everywhere",0,1],["inherited",0,1],["ancestral",0,0],["arrived within three generations",1,1],["pre-human",0,1]]},
 {code:"SGRO",name:"Vesserine",arch:"Vault",terrain:"Caldera basin",
  blurb:"A lake in a sunken crater with one way in and a granary on the far rim. The valley has everything it needs and sees no reason to tell anyone.",
  sway:[["Vault Council",70],["Saltwardens",20],["Rime Chapter",10]],
  f:[["none, cut off",0,0],["one gate, open at dawn",1,0],["one tongue, guarded",0,0],["a harbour the vault forgot",1,0],["turned away at the rope",0,1],
     ["terraced, rich",0,1],["springs, unfailing",0,1],["deep vein",0,1],["wild, abundant",0,1],["harsh winter, rich summer",1,1],
     ["the vault courts",0,1],["vault-guard",0,1],["minted, hoarded",0,1],["archived",0,1],["exact, public",0,1],
     ["sealed galleries",0,1],["vendettas",0,1],["sworn oaths",0,1],["old families",0,1],["ancient, unsaid",0,1]]},
 {code:"PGUN",name:"Sunder Coast",arch:"Boomcoast",terrain:"River delta",
  blurb:"Silt flats where two rivers reach the sea, crowded with quays, orchards and warehouses. Rich, open and governed mostly by whoever shows up with a contract.",
  sway:[["Hollow Syndicate",62],["Guild of Quays",28],["Warden's Office",10]],
  f:[["coast road, paved by the Syndicate",0,1],["open, unpatrolled",0,1],["a dozen trade creoles",0,1],["deep-water harbours",0,1],["everyone welcome, for a price",0,1],
     ["river silt, rich",0,1],["two wide rivers",0,1],["shallow iron",0,1],["orchards",0,1],["long, warm",0,1],
     ["guild charters",1,0],["hired blades",1,0],["a dozen mints",0,1],["tally sticks",0,0],["guild-settled",0,0],
     ["few, mostly quays",0,0],["inherited, one-sided",1,1],["none that stayed",0,0],["arrived, transient",0,0],["named this season",0,0]]},
 {code:"SWUO",name:"Ostry Fells",arch:"Boneyard",terrain:"Frozen fell",
  blurb:"Heather and bog above the snowline, with dykes nobody keeps and barrows everybody does. The clans are older than the maps and still count their dead.",
  sway:[["Clan Assembly",58],["Rime Chapter",30],["Hollow Syndicate",12]],
  f:[["none, drifted over",0,0],["dyke-lines, nobody's",0,0],["polyglot, rough",1,0],["a frozen harbour, used",1,0],["wary, stone-faced",0,0],
     ["peat, sour",0,0],["bog, undrinkable",0,0],["none",0,0],["heather, sparse",0,0],["winter-long",0,0],
     ["customary, unwritten",0,0],["war-bands",0,1],["bartered",0,0],["bone-carved",0,0],["blood-price",0,1],
     ["barrows",0,1],["winter war, unpaid",0,1],["cairns",0,1],["clans",0,1],["unnamed, recently",1,0]]},
 {code:"PGRO",name:"Aldermere",arch:"Seat",terrain:"River floodplain",
  blurb:"The fat middle of the map: the crown's grain, the guild's mills, and an abbey whose bells can be heard in three counties.",
  sway:[["Crown of Aldermere",60],["Millers' Guild",25],["Old Abbey",15]],
  f:[["river road, barge-towed",0,1],["open fords",0,1],["one trade tongue, many accents",0,1],["river quays",0,1],["wary, but unbarred",1,0],
     ["alluvial, deep",0,1],["the river, always",0,1],["worked out, stone only",1,0],["pasture and orchard",0,1],["wet, fertile",0,1],
     ["the crown's courts",0,1],["levied militia",0,1],["guild scrip",0,1],["parish registers",0,1],["crown assizes",0,1],
     ["old causeways",0,1],["parish feuds, shallow",0,0],["the abbey's bells",0,1],["arrived, many",1,0],["named for the river",0,1]]},
 {code:"SWRN",name:"Cinder Reach",arch:"Forge",terrain:"Volcanic plateau",
  blurb:"Obsidian and sulphur under a permanent sky of ash. The consortium owns the furnaces, and the furnaces own the valley.",
  sway:[["Forge Consortium",58],["Ash-Monks",27],["Slag Gangs",15]],
  f:[["one road, forge to fort",0,0],["ash-walls, shut",0,0],["dialects, many",1,0],["open harbour, ash-choked",1,0],["watched at the gate",0,1],
     ["ash, thin",0,0],["scarce, boiled",0,0],["obsidian, iron, sulphur",0,1],["cultivated, in ash",1,0],["dry, long",0,0],
     ["the Forge charter",0,1],["furnace-guard",0,1],["consortium scrip",0,1],["ledger-keepers",0,1],["by contract",0,0],
     ["slag heaps",0,0],["strike-era, unforgotten",0,1],["the Ash-Monks' fires",0,0],["forge-families, arrived",0,1],["named by the furnace",0,0]]}
];
REGIONS.forEach(r=>{r.dominant=r.sway[0]});

/* the spider stats for a region, each 1–5 */
function statsOf(r){
  const c={};STATS.forEach(([k])=>c[k]=0);
  FACETS.forEach((name,i)=>{if(r.f[i][2])(TAGS[name]||[]).forEach(k=>c[k]++)});
  const s={};STATS.forEach(([k])=>s[k]=Math.round(1+4*c[k]/TOTAL[k]));
  return s;
}
REGIONS.forEach(r=>{r.stats=statsOf(r)});

/* the letters of a region's code, read against the facet groups */
const POLE={P:"Passable",S:"Sealed",G:"Giving",W:"Withholding",R:"Ruled",U:"Unruled",O:"Old",N:"New"};

function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(a,r){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}

/* which ties a web carries: a spine so every region is linked, then extra pairs,
   then at least two warm, two hostile and two complicated ties */
function buildTies(seed,want=15){  // 15 = every pair of six regions, the "impossible" web
  const rand=mulberry(seed),n=REGIONS.length;
  const taken=new Set(),pairs=[];
  const addPair=(a,b)=>{if(a===b)return false;const k=a<b?a+":"+b:b+":"+a;if(taken.has(k))return false;taken.add(k);pairs.push([a,b]);return true};
  const order=shuffled([...Array(n).keys()],rand);
  for(let i=1;i<n;i++)addPair(order[i],order[Math.floor(rand()*i)]);
  let g=0;while(pairs.length<want&&g++<500)addPair(Math.floor(rand()*n),Math.floor(rand()*n));

  const pool=shuffled(TIE_LIB.map((t,i)=>({...t,i})),rand),spent=new Set();
  const draw=v=>{
    let a=pool.filter(t=>!spent.has(t.i)&&(!v||t.v===v));
    if(!a.length)a=pool.filter(t=>!v||t.v===v);
    if(!a.length)return null;
    const t=a[Math.floor(rand()*a.length)];spent.add(t.i);return t;
  };
  const left=shuffled(pairs,rand),out=[];
  for(const v of ["p","n","x"])for(let k=0;k<2&&left.length;k++){const t=draw(v);if(t)out.push({pr:left.shift(),t})}
  for(const pr of left)out.push({pr,t:draw(null)});
  return out.filter(o=>o.t).map(({pr,t})=>{
    const flip=t.d===1&&rand()<0.5;
    return {a:flip?pr[1]:pr[0],b:flip?pr[0]:pr[1],t};
  });
}

/* =====================================================================
   STATE + DOM
   ===================================================================== */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),stage=document.getElementById("stage"),rail=document.getElementById("rail");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=0,H=0,dpr=1,nodes=[],links=[],selected=null,hovered=null,dragging=null,tipEl=null,labelBoxes=[];
let C={};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function readTokens(){C={pos:css("--pos"),neg:css("--neg"),cpx:css("--cpx"),ink:css("--ink"),soft:css("--ink-soft"),faint:css("--ink-faint"),bg:css("--bg"),panel:css("--panel"),sphere:css("--sphere"),rule:css("--rule")}}
const vcol=v=>v==="p"?C.pos:v==="n"?C.neg:C.cpx;
const VWORD={p:"warm",n:"hostile",x:"complicated"};

function generate(seed){
  const cx=W/2||450,cy=H/2||300,R=Math.min(cx,cy)*0.45;
  nodes=REGIONS.map((r,i)=>{
    const a=(i/REGIONS.length)*Math.PI*2-Math.PI/2;
    return {id:i,name:r.name,code:r.code,arch:r.arch,terrain:r.terrain,r:36,
      x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,vx:0,vy:0};
  });
  retie(seed);
}
function retie(seed){
  links=buildTies(seed===undefined?(Math.random()*1e9|0):seed);
  selected=null;hovered=null;
  renderRail();
}

/* ---------- physics ---------- */
function step(){
  const n=nodes.length;if(!n)return;
  const cx=W/2,cy=H/2,rest=Math.max(190,Math.min(W,H)*0.36);
  for(let i=0;i<n;i++){
    const a=nodes[i];
    a.vx+=(cx-a.x)*0.0006;a.vy+=(cy-a.y)*0.0006;
    if(!reduce){a.vx+=(Math.random()-.5)*0.03;a.vy+=(Math.random()-.5)*0.03}
    for(let j=i+1;j<n;j++){
      const b=nodes[j];
      let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01;
      const ux=dx/d,uy=dy/d;
      const rep=Math.min(2.6,16000/(d*d));
      a.vx-=ux*rep;a.vy-=uy*rep;b.vx+=ux*rep;b.vy+=uy*rep;
      const sep=a.r+b.r+104;
      if(d<sep){const p=(sep-d)*0.05;a.x-=ux*p;a.y-=uy*p;b.x+=ux*p;b.y+=uy*p}
    }
  }
  for(const l of links){
    const a=nodes[l.a],b=nodes[l.b];
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||0.01;
    const f=(d-rest)*0.0022,ux=dx/d,uy=dy/d;
    a.vx+=ux*f;a.vy+=uy*f;b.vx-=ux*f;b.vy-=uy*f;
  }
  const pad=76,damp=reduce?0.72:0.86;
  for(const a of nodes){
    if(a===dragging){a.vx=a.vy=0;continue}
    a.vx*=damp;a.vy*=damp;
    const sp=Math.hypot(a.vx,a.vy);
    if(sp>6){a.vx*=6/sp;a.vy*=6/sp}
    a.x+=a.vx;a.y+=a.vy;
    if(a.x<pad){a.x=pad;a.vx=Math.abs(a.vx)*.4}
    if(a.x>W-pad){a.x=W-pad;a.vx=-Math.abs(a.vx)*.4}
    if(a.y<pad){a.y=pad;a.vy=Math.abs(a.vy)*.4}
    if(a.y>H-pad-10){a.y=H-pad-10;a.vy=-Math.abs(a.vy)*.4}
  }
}

/* ---------- drawing ---------- */
const NAME_FONT='600 14px "Fraunces", Georgia, serif';
const SRC_FONT='400 10px "IBM Plex Mono", ui-monospace, monospace';
const TIE_FONT='500 11px "IBM Plex Mono", ui-monospace, monospace';

function wavy(x1,y1,x2,y2,amp,wl){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const ux=dx/len,uy=dy/len,px=-uy,py=ux;
  const steps=Math.max(10,Math.round(len/3));
  ctx.beginPath();
  for(let i=0;i<=steps;i++){
    const t=i/steps,d=t*len,taper=Math.sin(Math.PI*t);
    const off=Math.sin(d/wl*Math.PI*2)*amp*taper;
    const x=x1+ux*d+px*off,y=y1+uy*d+py*off;
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();
}
function head(x,y,ux,uy,s,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(uy,ux));
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-s,s*0.46);ctx.lineTo(-s*0.72,0);ctx.lineTo(-s,-s*0.46);
  ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore();
}

/* the text under a sphere: name (wrapped if long), then the terrain */
function nameStack(nd){
  ctx.font=NAME_FONT;
  const words=nd.name.split(" ");
  let lines=[nd.name];
  if(ctx.measureText(nd.name).width>150&&words.length>1){
    const mid=Math.ceil(words.length/2);
    lines=[words.slice(0,mid).join(" "),words.slice(mid).join(" ")];
  }
  const out=lines.map((txt,i)=>({txt,font:NAME_FONT,col:C.ink,y:nd.y+nd.r+8+i*16,w:ctx.measureText(txt).width}));
  ctx.font=SRC_FONT;
  out.push({txt:nd.terrain,font:SRC_FONT,col:C.faint,y:nd.y+nd.r+9+lines.length*16,w:ctx.measureText(nd.terrain).width});
  return out;
}
const overlaps=(A,B)=>!(A.x+A.w<B.x||B.x+B.w<A.x||A.y+A.h<B.y||B.y+B.h<A.y);

function draw(){
  ctx.clearRect(0,0,W,H);
  const focus=selected!=null?selected:(hovered&&hovered.kind==="node"?hovered.id:null);
  const hoverLink=hovered&&hovered.kind==="link"?hovered.id:null;
  const touchesFocus=l=>focus==null||l.a===focus||l.b===focus;
  const isDim=nd=>focus!=null&&nd.id!==focus&&!links.some(l=>(l.a===focus&&l.b===nd.id)||(l.b===focus&&l.a===nd.id));

  // lines and arrowheads
  const pending=[];
  links.forEach((l,li)=>{
    const a=nodes[l.a],b=nodes[l.b];
    const touched=touchesFocus(l);
    const hot=li===hoverLink||(focus!=null&&touched);
    const alpha=focus==null?1:(touched?1:0.16);
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const ux=dx/d,uy=dy/d,gap=9;
    const x1=a.x+ux*(a.r+gap),y1=a.y+uy*(a.r+gap);
    const x2=b.x-ux*(b.r+gap),y2=b.y-uy*(b.r+gap);
    const col=vcol(l.t.v);
    ctx.save();
    ctx.globalAlpha=alpha;ctx.strokeStyle=col;ctx.lineWidth=hot?2.6:1.9;ctx.lineCap="round";
    const ax=x2-ux*10,ay=y2-uy*10,bx=x1+ux*10,by=y1+uy*10;
    if(l.t.v==="n"){ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ax,ay);ctx.stroke();ctx.setLineDash([])}
    else if(l.t.v==="x"){wavy(l.t.d===2?bx:x1,l.t.d===2?by:y1,ax,ay,4.6,26)}
    else{ctx.beginPath();ctx.moveTo(l.t.d===2?bx:x1,l.t.d===2?by:y1);ctx.lineTo(ax,ay);ctx.stroke()}
    head(x2,y2,ux,uy,10,col);
    if(l.t.d===2)head(x1,y1,-ux,-uy,10,col);
    ctx.restore();
    if(focus==null||touched){
      ctx.font=TIE_FONT;
      pending.push({li,txt:l.t.n,mx:(x1+x2)/2,my:(y1+y2)/2,w:ctx.measureText(l.t.n).width+12,h:16,dy:0,
        col:hot?col:C.faint,alpha:alpha*(hot?1:0.9)});
    }
  });

  // what a tie label must avoid: the spheres and their text stacks
  const fixed=[];
  nodes.forEach(nd=>{
    fixed.push({x:nd.x-nd.r,y:nd.y-nd.r,w:nd.r*2,h:nd.r*2});
    nameStack(nd).forEach(s=>fixed.push({x:nd.x-s.w/2-5,y:s.y-2,w:s.w+10,h:15}));
  });

  // place labels: keep to the line; if crowded, step up (then down) until clear
  const boxOf=L=>({x:L.mx-L.w/2,y:L.my-L.h/2+L.dy,w:L.w,h:L.h});
  pending.sort((a,b)=>(a.mx-b.mx)||(b.my-a.my));
  const settled=[];
  const OFFSETS=[0];for(let k=1;k<=20;k++)OFFSETS.push(-5*k);for(let k=1;k<=10;k++)OFFSETS.push(5*k);
  const collisions=L=>{
    const box=boxOf(L);let n=0;
    for(const f of fixed)if(overlaps(box,f))n++;
    for(const s of settled)if(overlaps(box,boxOf(s)))n++;
    return n;
  };
  for(const L of pending){
    let best=null;
    for(const dy of OFFSETS){
      L.dy=dy;const n=collisions(L);
      if(n===0){best={dy,n};break}
      if(best===null||n<best.n)best={dy,n};
    }
    L.dy=best.dy;
    settled.push(L);
  }
  labelBoxes=settled.map(L=>({li:L.li,...boxOf(L)}));

  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const L of settled){
    ctx.save();
    ctx.globalAlpha=L.alpha;
    const y=L.my+L.dy;
    if(Math.abs(L.dy)>3){
      ctx.strokeStyle=L.col;ctx.globalAlpha=L.alpha*0.35;ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(L.mx,L.my);ctx.lineTo(L.mx,y+(L.dy<0?L.h/2-1:1-L.h/2));ctx.stroke();
      ctx.globalAlpha=L.alpha;
    }
    ctx.fillStyle=C.bg;ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(L.mx-L.w/2,y-L.h/2,L.w,L.h,8);else ctx.rect(L.mx-L.w/2,y-L.h/2,L.w,L.h);
    ctx.fill();
    ctx.font=TIE_FONT;ctx.fillStyle=L.col;
    ctx.fillText(L.txt,L.mx,y+0.5);
    ctx.restore();
  }

  // spheres
  nodes.forEach(nd=>{
    const dim=isDim(nd);
    ctx.save();
    ctx.globalAlpha=dim?0.22:1;
    const g=ctx.createRadialGradient(nd.x-nd.r*0.38,nd.y-nd.r*0.44,nd.r*0.12,nd.x,nd.y,nd.r*1.15);
    g.addColorStop(0,"rgba(255,255,255,.55)");g.addColorStop(0.42,C.sphere);g.addColorStop(1,"rgba(0,0,0,.32)");
    ctx.beginPath();ctx.arc(nd.x,nd.y,nd.r,0,Math.PI*2);
    ctx.fillStyle=C.sphere;ctx.fill();
    ctx.fillStyle=g;ctx.fill();
    if(nd.id===focus){
      ctx.lineWidth=2;ctx.strokeStyle=C.ink;ctx.stroke();
      ctx.beginPath();ctx.arc(nd.x,nd.y,nd.r+6,0,Math.PI*2);
      ctx.lineWidth=1;ctx.strokeStyle=C.faint;ctx.stroke();
    }
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font='500 11.5px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillStyle="rgba(255,255,255,.95)";
    ctx.fillText(nd.code,nd.x,nd.y-6);
    ctx.font='500 9.5px "IBM Plex Mono", ui-monospace, monospace';
    ctx.fillStyle="rgba(255,255,255,.78)";
    ctx.fillText(nd.arch.toLowerCase(),nd.x,nd.y+8);

    ctx.textBaseline="top";
    nameStack(nd).forEach(s=>{
      ctx.font=s.font;
      ctx.fillStyle=C.bg;ctx.globalAlpha=(dim?0.22:1)*0.88;
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(nd.x-s.w/2-5,s.y-2,s.w+10,15,5);ctx.fill()}
      ctx.globalAlpha=dim?0.22:1;
      ctx.fillStyle=s.col;
      ctx.fillText(s.txt,nd.x,s.y);
    });
    ctx.restore();
  });
}

/* ---------- loop + sizing ---------- */
function frame(){step();draw();requestAnimationFrame(frame)}
function resize(){
  const r=stage.getBoundingClientRect();
  W=Math.max(200,r.width);H=Math.max(200,r.height);
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(resize).observe(stage);

/* ---------- interaction ---------- */
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function nodeAt(p){for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];if(Math.hypot(n.x-p.x,n.y-p.y)<=n.r+4)return n}return null}
function linkAt(p){
  for(const b of labelBoxes)if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b.li;
  for(let i=0;i<links.length;i++){
    const a=nodes[links[i].a],b=nodes[links[i].b];
    const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1;
    let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;t=Math.max(0,Math.min(1,t));
    if(Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t))<10)return i;
  }
  return -1;
}
function showTip(p,html){
  if(!tipEl){tipEl=document.createElement("div");tipEl.className="tip";stage.appendChild(tipEl)}
  tipEl.innerHTML=html;
  tipEl.style.left=Math.max(130,Math.min(W-130,p.x))+"px";
  tipEl.style.top=(p.y-14)+"px";
  tipEl.hidden=false;
}
function hideTip(){if(tipEl)tipEl.hidden=true}
const isBare=()=>document.body.classList.contains("bare");

cv.addEventListener("pointerdown",e=>{
  const n=nodeAt(pt(e));
  if(n){dragging=n;cv.setPointerCapture(e.pointerId);cv.classList.add("dragging")}
});
cv.addEventListener("pointermove",e=>{
  const p=pt(e);
  if(dragging){dragging.x=p.x;dragging.y=p.y;return}
  const n=nodeAt(p);
  if(n){
    hovered={kind:"node",id:n.id};
    const r=REGIONS[n.id],ties=links.filter(l=>l.a===n.id||l.b===n.id).length;
    showTip(p,`<strong>${esc(r.name)}</strong>${esc(r.code)} · ${esc(r.arch)} · ${esc(r.terrain)}<div class="roles">Dominant: ${esc(r.dominant[0])} ${r.dominant[1]}% · ${ties} tie${ties===1?"":"s"} — ${isBare()?"F2 for the ground":"click to open"}</div>`);
    return;
  }
  const li=linkAt(p);
  if(li>=0){
    hovered={kind:"link",id:li};
    const l=links[li],t=l.t;
    showTip(p,`<strong>${esc(t.n)}</strong>${esc(t.g)}<div class="roles">${esc(nodes[l.a].name)} ${t.d===2?"⇄":"→"} ${esc(nodes[l.b].name)} · ${esc(t.c)}</div>`);
    return;
  }
  hovered=null;hideTip();
});
cv.addEventListener("pointerup",e=>{
  if(dragging){cv.classList.remove("dragging");dragging=null;return}
  const n=nodeAt(pt(e));
  selected=n?(selected===n.id?null:n.id):null;
  renderRail();
});
cv.addEventListener("pointerleave",()=>{hovered=null;hideTip()});

/* ---------- rail ---------- */
function tieRow(l){
  const t=l.t,A=nodes[l.a].name,B=nodes[l.b].name,arrow=t.d===2?"⇄":"→";
  return `<li><button class="item" data-r="${l.a}">
    <span class="pair"><span>${esc(A)}</span><span class="arrow v-${t.v}">${arrow}</span><span>${esc(B)}</span></span>
    <span class="iname">${esc(t.n)}</span>
    <span class="imeta">${esc(t.g)} <span class="v-${t.v}">· ${VWORD[t.v]}${t.d===1?", one-way":""}</span> · ${esc(t.c)}</span>
  </button></li>`;
}
function regionRow(r){
  return `<li><button class="item" data-r="${r.id}">
    <span class="iname">${esc(r.name)}</span>
    <span class="imeta"><span class="code">${esc(r.code)}</span> ${esc(r.arch)} · ${esc(r.terrain)}</span>
    <span class="imeta">Dominant ${esc(r.dominant[0])} ${r.dominant[1]}%</span>
  </button></li>`;
}
function radarSVG(st){
  const cx=160,cy=135,R=80;
  const ang=i=>-Math.PI/2+i*Math.PI/3;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/5,cy+Math.sin(ang(i))*R*v/5];
  let rings="";[1,2,3,4,5].forEach(v=>{rings+=`<polygon class="ring" points="${STATS.map((_,i)=>pt(i,v).join(",")).join(" ")}"/>`});
  const axes=STATS.map((_,i)=>{const[x,y]=pt(i,5);return `<line class="axis" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`}).join("");
  const poly=STATS.map(([k],i)=>pt(i,st[k]).join(",")).join(" ");
  const dots=STATS.map(([k],i)=>{const[x,y]=pt(i,st[k]);return `<circle class="dot" cx="${x}" cy="${y}" r="3"/>`}).join("");
  const labels=STATS.map(([k,name],i)=>{
    const[x,y]=pt(i,5.6);
    const anchor=Math.abs(x-cx)<6?"middle":x<cx?"end":"start";
    return `<text class="axlab" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle">${name} <tspan class="axnum">${st[k]}</tspan></text>`;
  }).join("");
  return `<svg class="radar" viewBox="-10 0 340 270" role="img" aria-label="Spider chart of six stats, each scored 1 to 5">${rings}${axes}<polygon class="shape" points="${poly}"/>${dots}${labels}</svg>`;
}
function leaders(){
  return STATS.map(([k,,phrase])=>{
    const ranked=[...REGIONS].sort((a,b)=>b.stats[k]-a.stats[k]);
    const top=ranked[0].stats[k];
    const lead=ranked.filter(r=>r.stats[k]===top).map(r=>r.name);
    const rest=ranked.filter(r=>r.stats[k]!==top).map(r=>`${esc(r.name)} ${r.stats[k]}`);
    return `<div class="leader"><b>${phrase}</b> — ${esc(lead.join(" = "))} ${top}${rest.length?` · ${rest.join(" · ")}`:""}</div>`;
  }).join("");
}
function facetGroups(r){
  return GROUPS.map(g=>{
    const letter=r.code[g.letter];
    const pole=Object.entries(g.poles).map(([L,name])=>`<span class="${L===letter?"on":""}">${name}</span>`).join(" / ");
    const rows=FACETS.slice(g.from,g.from+5).map((name,j)=>{
      const [text,against,pos]=r.f[g.from+j];
      return `<div class="fac${against?" off":""}"><span class="fn">${pos?'<span class="dot">●</span>':""}${name}</span><span class="ft">${esc(text)}</span></div>`;
    }).join("");
    return `<section class="grp"><h3>${g.name}<span class="pole">${pole}</span></h3>${rows}</section>`;
  }).join("");
}
function renderRail(){
  if(selected==null){
    const counts={p:0,n:0,x:0};links.forEach(l=>counts[l.t.v]++);
    const withIds=REGIONS.map((r,i)=>({...r,id:i}));
    rail.innerHTML=`<h2>The six regions</h2>
      <p class="sub">${REGIONS.length} regions · ${links.length} ties · ${counts.p} warm / ${counts.n} hostile / ${counts.x} complicated</p>
      <h3 class="railhead">Regions</h3>
      <ul class="list">${withIds.map(regionRow).join("")}</ul>
      <h3 class="railhead">Ties</h3>
      <ul class="list">${links.map(tieRow).join("")}</ul>
      <h3 class="railhead">Who leads</h3>
      ${leaders()}`;
  }else{
    const r=REGIONS[selected];
    const mine=links.filter(l=>l.a===selected||l.b===selected);
    const bars=r.sway.map(([name,pct],i)=>`<div class="bar${i===0?" lead":""}"><div class="bl"><span>${esc(name)}</span><b>${pct}%</b></div><div class="track"><i style="width:${pct}%"></i></div></div>`).join("");
    const against=r.f.filter(f=>f[1]).length;
    rail.innerHTML=`<button class="backlink" id="back">← the six regions</button>
      <h2>${esc(r.name)}</h2>
      <p class="sub"><span class="code">${esc(r.code)}</span> ${esc(r.arch)}</p>
      <p class="terrain">Primary terrain: ${esc(r.terrain)}</p>
      <p class="blurb">${esc(r.blurb)}</p>
      <h3 class="railhead">Spider <span class="hint">1 to 5</span></h3>
      ${radarSVG(r.stats)}
      <h3 class="railhead">Sway <span class="hint">dominant, then the rest</span></h3>
      ${bars}
      <h3 class="railhead">Ground <span class="hint">${against} against the letters</span></h3>
      <p class="keyline">● counts toward the spider. Amber runs against the region's letters.</p>
      ${facetGroups(r)}
      <h3 class="railhead">Ties</h3>
      ${mine.length?`<ul class="list">${mine.map(tieRow).join("")}</ul>`:`<p class="empty">Unconnected. Retie to draw new ties.</p>`}`;
    rail.querySelector("#back").addEventListener("click",()=>{selected=null;renderRail()});
  }
  rail.querySelectorAll(".item").forEach(btn=>btn.addEventListener("click",()=>{
    selected=+btn.dataset.r;renderRail();rail.scrollTop=0;
  }));
}

/* ---------- controls ---------- */
document.getElementById("retie").addEventListener("click",()=>retie());
document.getElementById("copy").addEventListener("click",async e=>{
  const regions=REGIONS.map(r=>{
    const s=r.stats;
    const against=r.f.map((f,i)=>f[1]?FACETS[i]:null).filter(Boolean);
    return `${r.name} (${r.code}, ${r.arch}) — ${r.terrain}\n    ${r.blurb}\n    dominant: ${r.sway.map(([n,p])=>`${n} ${p}%`).join(", ")}\n    stats: ${STATS.map(([k,name])=>`${name} ${s[k]}`).join(", ")}\n    against the letters: ${against.length?against.join(", "):"none"}`;
  }).join("\n");
  const ties=links.map(l=>`${nodes[l.a].name} ${l.t.d===2?"<->":"->"} ${nodes[l.b].name}  |  ${l.t.n}  —  ${l.t.g}`).join("\n");
  const txt=`REGIONS\n${regions}\n\nTIES\n${ties}\n`;
  const btn=e.currentTarget;
  try{await navigator.clipboard.writeText(txt);btn.textContent="Copied"}
  catch{btn.textContent="Clipboard blocked"}
  setTimeout(()=>btn.textContent="Copy as text",1600);
});

const chromeBtn=document.getElementById("chromeToggle");
function setBare(on){
  document.body.classList.toggle("bare",on);
  chromeBtn.setAttribute("aria-pressed",String(!on));
  chromeBtn.firstChild.textContent=on?"panels ":"hide ";
  chromeBtn.title=on?"Show the controls and profiles (F2)":"Back to the map alone (F2)";
  resize();
}
chromeBtn.addEventListener("click",()=>setBare(!isBare()));
addEventListener("keydown",e=>{
  if(e.key==="F2"){e.preventDefault();setBare(!isBare());return}
  if(e.key==="Escape"&&selected!=null){selected=null;renderRail()}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readTokens);
new MutationObserver(readTokens).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ---------- boot ---------- */
readTokens();
setBare(true);
resize();
generate();
requestAnimationFrame(frame);
</script>

</body>
</html>
