<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>full‑screen gallery · all images · F2 screenshot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        }

        /* ----- toolbar: visible only before first import ----- */
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 20, 0.95);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 100;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #2e2e2e;
        }

        .toolbar.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .import-btn {
            background: #2d2d2d;
            color: #f0f0f0;
            border: 1px solid #555;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .import-btn:hover {
            background: #3d3d3d;
            border-color: #7a7a7a;
        }

        .import-btn:active {
            background: #1f1f1f;
        }

        .hint {
            color: #999;
            font-size: 0.9rem;
            margin-left: auto;
            font-weight: 400;
        }

        .hint kbd {
            background: #2b2b2b;
            border-radius: 6px;
            padding: 4px 10px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #e0e0e0;
            border: 1px solid #464646;
            margin: 0 2px;
        }

        /* ----- full‑screen gallery: zero margins, zero padding, zero gaps ----- */
        .gallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
            z-index: 1;
        }

        /* each image cell: no margin, no padding, no gap; flex to fill space */
        .image-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            background: #000;
        }

        /* the image: fit inside its cell, maintain aspect ratio */
        .image-cell img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            background: #000;
            border: none;
            outline: none;
            box-shadow: none;
            margin: 0;
            padding: 0;
        }

        /* empty state message */
        .empty-message {
            color: #666;
            font-size: 1.4rem;
            text-align: center;
            user-select: none;
            border: 2px dashed #2a2a2a;
            padding: 60px 80px;
            border-radius: 50px;
            background: #111;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 5;
            margin: auto;
        }

        .empty-message span {
            display: block;
            margin-top: 16px;
            font-size: 1rem;
            color: #555;
        }

        /* hide empty message when images exist */
        body.imported .empty-message {
            display: none;
        }

        /* screenshot flash feedback */
        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 0.15s ease;
        }

        .flash.active {
            opacity: 0.4;
        }

        /* fade-in for images */
        .image-cell img {
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ----- dynamic grid layout ----- */
        /* We use CSS Grid for precise control over fitting all images.
           The grid dimensions are computed in JS based on the number of images
           and the screen aspect ratio, then applied inline to .gallery.
           This ensures all images fill the screen without gaps and are scaled
           to fit while maintaining aspect ratio. */

        .gallery {
            /* grid-template-columns and grid-template-rows set via JS */
            display: grid;
            gap: 0;
            padding: 0;
        }

        .image-cell {
            /* grid items fill their cells */
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
        }

        .image-cell img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body class="no-select">
    <!-- toolbar: visible only before import -->
    <div class="toolbar" id="toolbar">
        <button class="import-btn" id="importBtn">📁 Import images</button>
        <div class="hint">
            <kbd>F2</kbd> screenshot → PNG
        </div>
    </div>

    <!-- full‑screen gallery: all images, zero margins/padding/gaps -->
    <div class="gallery" id="gallery">
        <div class="empty-message" id="emptyMessage">
            No images yet
            <span>browse or drag & drop</span>
        </div>
        <!-- image cells inserted dynamically -->
    </div>

    <!-- flash overlay -->
    <div class="flash" id="flashOverlay"></div>

    <script>
        (function() {
            // ----- state -----
            let imageFiles = [];

            // DOM elements
            const bodyEl = document.body;
            const toolbarEl = document.getElementById('toolbar');
            const galleryEl = document.getElementById('gallery');
            const importBtn = document.getElementById('importBtn');
            const flashOverlay = document.getElementById('flashOverlay');

            // hidden file input
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.multiple = true;
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);

            // ----- helper: clear gallery image cells -----
            function clearImageCells() {
                const cells = galleryEl.querySelectorAll('.image-cell');
                cells.forEach(cell => cell.remove());
            }

            // ----- helper: compute optimal grid dimensions -----
            // Returns { cols, rows } that best fits count images into a rectangle
            // matching the screen aspect ratio, minimizing wasted space.
            function computeGridDimensions(count, screenAspect) {
                // screenAspect = width / height
                let bestCols = 1, bestRows = count;
                let bestScore = Infinity;

                // Try all possible column counts from 1 to count
                for (let cols = 1; cols <= count; cols++) {
                    const rows = Math.ceil(count / cols);
                    // The grid will have cols * rows cells; last row may have fewer items
                    // We want the aspect ratio of the grid (cols/rows) to match screenAspect
                    // as closely as possible, but also consider unused cells in last row.
                    
                    const gridAspect = cols / rows;
                    const aspectDiff = Math.abs(Math.log(gridAspect / screenAspect)); // log ratio for symmetry
                    
                    // Penalty for empty cells in last row (if any)
                    const emptyCells = (cols * rows) - count;
                    const emptyPenalty = emptyCells * 0.5; // weight
                    
                    const score = aspectDiff + emptyPenalty;
                    
                    if (score < bestScore) {
                        bestScore = score;
                        bestCols = cols;
                        bestRows = rows;
                    }
                }

                return { cols: bestCols, rows: bestRows };
            }

            // ----- helper: apply grid layout -----
            function applyGridLayout() {
                const count = imageFiles.length;
                if (count === 0) {
                    galleryEl.style.gridTemplateColumns = '';
                    galleryEl.style.gridTemplateRows = '';
                    return;
                }

                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const screenAspect = screenWidth / screenHeight;

                const { cols, rows } = computeGridDimensions(count, screenAspect);

                // Set grid template: equal-sized columns and rows
                galleryEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
                galleryEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            }

            // ----- helper: render all images simultaneously -----
            function renderAllImages() {
                clearImageCells();

                if (imageFiles.length === 0) {
                    bodyEl.classList.remove('imported');
                    toolbarEl.classList.remove('hidden');
                    galleryEl.style.gridTemplateColumns = '';
                    galleryEl.style.gridTemplateRows = '';
                    return;
                }

                // hide toolbar, full-screen gallery
                bodyEl.classList.add('imported');
                toolbarEl.classList.add('hidden');

                // create a cell for each image
                imageFiles.forEach((item, index) => {
                    const cell = document.createElement('div');
                    cell.className = 'image-cell';

                    const img = document.createElement('img');
                    img.src = item.url;
                    img.alt = item.name || `image-${index + 1}`;
                    img.loading = 'eager';

                    cell.appendChild(img);
                    galleryEl.appendChild(cell);
                });

                // apply dynamic grid
                applyGridLayout();
            }

            // ----- add images from file list -----
            function addImagesFromFiles(files) {
                if (!files || files.length === 0) return;

                const imageFilesArray = Array.from(files).filter(file =>
                    file.type.startsWith('image/')
                );

                if (imageFilesArray.length === 0) {
                    alert('No valid image files selected.');
                    return;
                }

                const newItems = imageFilesArray.map(file => ({
                    file: file,
                    url: URL.createObjectURL(file),
                    name: file.name
                }));

                imageFiles = imageFiles.concat(newItems);
                renderAllImages();
            }

            // ----- import button handler -----
            importBtn.addEventListener('click', () => {
                fileInput.click();
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    addImagesFromFiles(e.target.files);
                    fileInput.value = '';
                }
            });

            // ----- drag & drop on whole page -----
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                window.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            window.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();

                const dt = e.dataTransfer;
                if (dt.files && dt.files.length > 0) {
                    addImagesFromFiles(dt.files);
                }
            });

            // ----- keyboard: F2 screenshot -----
            window.addEventListener('keydown', (e) => {
                if (e.key === 'F2' || e.key === 'f2' || e.code === 'F2') {
                    e.preventDefault();
                    takeScreenshot();
                }
            });

            // ----- screenshot using html2canvas -----
            async function takeScreenshot() {
                if (typeof html2canvas === 'undefined') {
                    try {
                        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
                    } catch (err) {
                        alert('Screenshot library failed to load. Please check your connection.');
                        return;
                    }
                }

                // flash feedback
                flashOverlay.classList.add('active');
                setTimeout(() => {
                    flashOverlay.classList.remove('active');
                }, 120);

                const targetElement = galleryEl;

                try {
                    const canvas = await html2canvas(targetElement, {
                        scale: window.devicePixelRatio || 1,
                        backgroundColor: '#000000',
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                        windowWidth: window.innerWidth,
                        windowHeight: window.innerHeight,
                    });

                    const link = document.createElement('a');
                    link.download = `gallery-screenshot-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                } catch (error) {
                    console.error('Screenshot failed:', error);
                    alert('Could not capture screenshot. See console for details.');
                }
            }

            // helper: load external script
            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = () => resolve();
                    script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                    document.head.appendChild(script);
                });
            }

            // ----- window resize: re-apply grid layout -----
            window.addEventListener('resize', () => {
                if (imageFiles.length > 0) {
                    applyGridLayout();
                }
            });

            // ----- initial render -----
            renderAllImages();

            // ----- cleanup object URLs -----
            window.addEventListener('beforeunload', () => {
                imageFiles.forEach(item => {
                    if (item.url) URL.revokeObjectURL(item.url);
                });
            });
        })();
    </script>
</body>
</html>
