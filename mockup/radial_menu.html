<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wedge Dial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centred column — readout above, dial below. The dial is a single square SVG,
   so every wedge, divider and glyph shares one coordinate system and cannot drift. */
:root {
  --bg: #0a0e11;
  --plate: #121a1f;
  --plate-hi: #1a262e;
  --fg: #e9eff2;
  --muted: #8ba0ab;
  --faint: #52646e;
  --line: rgba(190, 215, 225, 0.16);
  --line-strong: rgba(190, 215, 225, 0.34);
  --accent: #f0a23c;
  --accent-dim: rgba(240, 162, 60, 0.16);
  --hot: rgba(190, 215, 225, 0.10);
  --hot-strong: rgba(205, 228, 238, 0.20);
  --display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9ecee;
    --plate: #ffffff;
    --plate-hi: #f1f4f6;
    --fg: #101619;
    --muted: #5c6e78;
    --faint: #9aaab2;
    --line: rgba(16, 36, 46, 0.16);
    --line-strong: rgba(16, 36, 46, 0.34);
    --accent: #b05d14;
    --accent-dim: rgba(176, 93, 20, 0.12);
    --hot: rgba(16, 36, 46, 0.07);
    --hot-strong: rgba(16, 36, 46, 0.14);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9ecee;
  --plate: #ffffff;
  --plate-hi: #f1f4f6;
  --fg: #101619;
  --muted: #5c6e78;
  --faint: #9aaab2;
  --line: rgba(16, 36, 46, 0.16);
  --line-strong: rgba(16, 36, 46, 0.34);
  --accent: #b05d14;
  --accent-dim: rgba(176, 93, 20, 0.12);
  --hot: rgba(16, 36, 46, 0.07);
  --hot-strong: rgba(16, 36, 46, 0.14);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  -webkit-tap-highlight-color: transparent;
}

/* ---- readout above the dial ---- */
.readout {
  display: grid;
  justify-items: center;
  gap: 4px;
  min-height: 74px;
  text-align: center;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--faint);
}
.title {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.7rem, 7vw, 2.4rem);
  line-height: 1;
  letter-spacing: -0.01em;
  text-wrap: balance;
  margin: 0;
}
.title.is-resting { color: var(--muted); }
.eyebrow.on { color: var(--accent); }
.counter {
  font-size: 11px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.08em;
  min-height: 14px;
}

/* ---- dial ---- */
.dial-wrap { width: min(540px, 88vmin); }
svg.dial {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  max-width: 100%;
  touch-action: none;
  cursor: pointer;
  outline: none;
}
/* everything but the hub lives in .menu-layer, which collapses away when closed */
.menu-layer {
  transition: opacity .18s ease, transform .18s ease;
  transform-box: view-box;
  transform-origin: 50% 50%;
}
.dial.is-closed .menu-layer { opacity: 0; transform: scale(.94); pointer-events: none; }
.readout { transition: opacity .18s ease; }
.readout.is-hidden { opacity: 0; visibility: hidden; }

.plate-bg { fill: var(--plate); }
.plate-ring { fill: none; stroke: var(--line); stroke-width: 1; }
.plate-ring.major { stroke: var(--line-strong); }

.wedge {
  fill: transparent;
  stroke: none;
  transition: fill .12s ease;
}
.wedge.in-cat { fill: var(--plate-hi); }
.wedge.cursor { fill: var(--hot); }
.wedge.is-outer.cursor { fill: var(--hot-strong); }
.wedge.active-cat { fill: var(--accent-dim); }

.divider { stroke: var(--line); stroke-width: 1; }
.divider.major { stroke: var(--line-strong); stroke-width: 1.4; }

.glyph {
  font-family: var(--emoji);
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
  transition: opacity .15s ease;
}
.glyph.outer { font-size: 25px; }
.glyph.inner { font-size: 23px; }
.glyph.dim { opacity: .34; }

.hub-face { fill: var(--plate-hi); stroke: var(--line-strong); stroke-width: 1.2; }
.hub-face.armed { stroke: var(--accent); }
.hub-glyph {
  font-family: var(--emoji);
  font-size: 44px;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
<style>
html, body { min-height: 100%; }
body { justify-content: center; }
</style>
</head>
<body>
<div class="readout is-hidden">
  <div class="eyebrow on" id="eyebrow">Smileys</div>
  <h1 class="title is-resting" id="title">Slight smile</h1>
  <div class="counter" id="counter"></div>
</div>

<div class="dial-wrap">
  <svg class="dial is-closed" id="dial" viewBox="0 0 400 400" role="img"
       aria-label="Radial emoji picker. Arrow keys to move, Enter to choose."></svg>
</div>

<script>
(function () {
  "use strict";

  // ---------- geometry (one coordinate system for everything) ----------
  var CX = 200, CY = 200;
  var R = { hub: 54, in0: 60, in1: 116, out0: 122, out1: 190, rim: 196 };
  var N_IN = 5, N_OUT = 20;          // 20 = 4 x 5, so every 4th outer divider lands on a category divider
  var STEP_IN = 360 / N_IN, STEP_OUT = 360 / N_OUT;

  function pt(r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return (CX + r * Math.cos(a)).toFixed(2) + " " + (CY + r * Math.sin(a)).toFixed(2);
  }
  function xy(r, deg) {
    var a = (deg - 90) * Math.PI / 180;
    return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };
  }
  function band(r0, r1, a0, a1) {
    var big = (a1 - a0) > 180 ? 1 : 0;
    return "M" + pt(r1, a0) +
           "A" + r1 + " " + r1 + " 0 " + big + " 1 " + pt(r1, a1) +
           "L" + pt(r0, a1) +
           "A" + r0 + " " + r0 + " 0 " + big + " 0 " + pt(r0, a0) + "Z";
  }

  // ---------- content ----------
  // Every glyph on the dial has a name; the readout reads it out.
  var NAMES = {
    "😀":"Grinning","😄":"Grinning eyes","😁":"Beaming","😆":"Squinting","😅":"Sweat grin",
    "😂":"Tears of joy","🙂":"Slight smile","🙃":"Upside down","😉":"Wink","😊":"Smiling eyes",
    "😍":"Heart eyes","🥰":"Smitten","😘":"Blowing a kiss","🤨":"Raised eyebrow","😎":"Sunglasses",
    "🤓":"Nerd","🤔":"Thinking","😴":"Sleeping","🥳":"Partying","🤯":"Mind blown",
    "🐶":"Dog","🐱":"Cat","🦊":"Fox","🐻":"Bear","🐼":"Panda","🐨":"Koala","🐯":"Tiger",
    "🦁":"Lion","🐸":"Frog","🐵":"Monkey","🐧":"Penguin","🦉":"Owl","🦅":"Eagle","🐙":"Octopus",
    "🦑":"Squid","🐢":"Turtle","🦎":"Lizard","🐝":"Bee","🦋":"Butterfly","🦄":"Unicorn",
    "🍏":"Green apple","🍎":"Red apple","🍐":"Pear","🍊":"Tangerine","🍋":"Lemon","🍌":"Banana",
    "🍉":"Watermelon","🍇":"Grapes","🍓":"Strawberry","🥝":"Kiwi","🥑":"Avocado","🥦":"Broccoli",
    "🌽":"Corn","🍞":"Bread","🧀":"Cheese","🍜":"Ramen","🍕":"Pizza","🌮":"Taco","🍩":"Doughnut",
    "☕":"Coffee",
    "🚗":"Car","🚕":"Taxi","🚙":"SUV","🚌":"Bus","🏎️":"Race car","🚓":"Police car","🚑":"Ambulance",
    "🚒":"Fire engine","🚜":"Tractor","🛵":"Scooter","🏍️":"Motorcycle","🚲":"Bicycle","✈️":"Airplane",
    "🚀":"Rocket","🚁":"Helicopter","⛵":"Sailboat","🚢":"Ship","🚂":"Locomotive","🗺️":"Map",
    "🏔️":"Mountain",
    "⌚":"Watch","📱":"Phone","💻":"Laptop","⌨️":"Keyboard","🖥️":"Desktop","🖱️":"Mouse",
    "💾":"Floppy disk","💿":"Disc","📷":"Camera","🎥":"Movie camera","📞":"Telephone",
    "📺":"Television","📻":"Radio","🎧":"Headphones","🔋":"Battery","💡":"Light bulb",
    "🔦":"Flashlight","🔑":"Key","📌":"Pushpin","✏️":"Pencil"
  };
  function nameOf(g) { return NAMES[g] || g; }

  var CATS = [
    { name: "Smileys", recent: "🙂", items: ["😀","😄","😁","😆","😅","😂","🙂","🙃","😉","😊",
                                             "😍","🥰","😘","🤨","😎","🤓","🤔","😴","🥳","🤯"] },
    { name: "Animals", recent: "🐙", items: ["🐶","🐱","🦊","🐻","🐼","🐨","🐯","🦁","🐸","🐵",
                                             "🐧","🦉","🦅","🐙","🦑","🐢","🦎","🐝","🦋","🦄"] },
    { name: "Food",    recent: "🍜", items: ["🍏","🍎","🍐","🍊","🍋","🍌","🍉","🍇","🍓","🥝",
                                             "🥑","🥦","🌽","🍞","🧀","🍜","🍕","🌮","🍩","☕"] },
    { name: "Travel",  recent: "🚀", items: ["🚗","🚕","🚙","🚌","🏎️","🚓","🚑","🚒","🚜","🛵",
                                             "🏍️","🚲","✈️","🚀","🚁","⛵","🚢","🚂","🗺️","🏔️"] },
    { name: "Objects", recent: "🎧", items: ["⌚","📱","💻","⌨️","🖥️","🖱️","💾","💿","📷","🎥",
                                             "📞","📺","📻","🎧","🔋","💡","🔦","🔑","📌","✏️"] }
  ];

  // ---------- state ----------
  var state = {
    open: false,          // closed: the hub alone, click it to bring the rings back
    cat: 0,               // a category is always open; the inner ring switches it
    cursor: { ring: null, index: -1 },   // 'hub' | 'inner' | 'outer' | null
    current: CATS[0].recent
  };

  var dial = document.getElementById("dial");
  var elTitle = document.getElementById("title");
  var elEyebrow = document.getElementById("eyebrow");
  var elCounter = document.getElementById("counter");


  var SVGNS = "http://www.w3.org/2000/svg";
  function make(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  // ---------- build the dial once; later we only swap text and classes ----------
  var outerWedges = [], innerWedges = [], outerGlyphs = [], innerGlyphs = [];
  var hubFace, hubGlyph;

  function build() {
    var menu = make("g", { "class": "menu-layer" });
    dial.appendChild(menu);

    menu.appendChild(make("circle", { cx: CX, cy: CY, r: R.rim, "class": "plate-bg" }));

    var gWedge = make("g", { "pointer-events": "none" });
    menu.appendChild(gWedge);

    var i, a0, a1, mid, p, t, c;

    for (i = 0; i < N_OUT; i++) {
      a0 = i * STEP_OUT; a1 = a0 + STEP_OUT;
      p = make("path", { d: band(R.out0, R.out1, a0, a1), "class": "wedge" });
      gWedge.appendChild(p); outerWedges.push(p);
    }
    for (i = 0; i < N_IN; i++) {
      a0 = i * STEP_IN; a1 = a0 + STEP_IN;
      p = make("path", { d: band(R.in0, R.in1, a0, a1), "class": "wedge" });
      gWedge.appendChild(p); innerWedges.push(p);
    }

    // rings
    var gRing = make("g", { "pointer-events": "none" });
    [[R.out1, "major"], [R.out0, ""], [R.in1, ""], [R.in0, ""]].forEach(function (r) {
      gRing.appendChild(make("circle", { cx: CX, cy: CY, r: r[0], "class": "plate-ring " + r[1] }));
    });
    menu.appendChild(gRing);

    // dividers — majors run across both bands, minors only across the item band
    var gDiv = make("g", { "pointer-events": "none" });
    for (i = 0; i < N_OUT; i++) {
      var deg = i * STEP_OUT;
      var major = (i % (N_OUT / N_IN)) === 0;
      var from = major ? xy(R.in0, deg) : xy(R.out0, deg);
      var to = xy(R.out1, deg);
      gDiv.appendChild(make("line", {
        x1: from.x.toFixed(2), y1: from.y.toFixed(2), x2: to.x.toFixed(2), y2: to.y.toFixed(2),
        "class": "divider" + (major ? " major" : "")
      }));
    }
    menu.appendChild(gDiv);

    // glyphs, placed at wedge mid-angles
    var gText = make("g", { "pointer-events": "none" });
    for (i = 0; i < N_OUT; i++) {
      mid = (i + 0.5) * STEP_OUT;
      c = xy((R.out0 + R.out1) / 2, mid);
      t = make("text", { x: c.x.toFixed(2), y: c.y.toFixed(2), "class": "glyph outer" });
      gText.appendChild(t); outerGlyphs.push(t);
    }
    for (i = 0; i < N_IN; i++) {
      mid = (i + 0.5) * STEP_IN;
      c = xy(78, mid);
      t = make("text", { x: c.x.toFixed(2), y: c.y.toFixed(2), "class": "glyph inner" });
      gText.appendChild(t); innerGlyphs.push(t);
    }
    menu.appendChild(gText);

    // hub
    var gHub = make("g", { "pointer-events": "none" });
    hubFace = make("circle", { cx: CX, cy: CY, r: R.hub, "class": "hub-face" });
    gHub.appendChild(hubFace);
    hubGlyph = make("text", { x: CX, y: CY + 1, "class": "hub-glyph" });
    gHub.appendChild(hubGlyph);
    dial.appendChild(gHub);
  }

  // ---------- derived ----------
  function outerSource() { return CATS[state.cat].items; }
  function ringName() { return CATS[state.cat].name; }

  // ---------- render ----------
  function render() {
    var src = outerSource();
    var i;

    for (i = 0; i < N_OUT; i++) outerGlyphs[i].textContent = src[i] || "";
    for (i = 0; i < N_IN; i++) innerGlyphs[i].textContent = CATS[i].recent;

    var cur = state.cursor;

    for (i = 0; i < N_OUT; i++) {
      var oc = "wedge is-outer in-cat";
      if (cur.ring === "outer" && cur.index === i) oc += " cursor";
      outerWedges[i].setAttribute("class", oc);
    }
    for (i = 0; i < N_IN; i++) {
      var ic = "wedge";
      if (state.cat === i) ic += " active-cat";
      if (cur.ring === "inner" && cur.index === i) ic += " cursor";
      innerWedges[i].setAttribute("class", ic);
      innerGlyphs[i].setAttribute("class", "glyph inner" + (state.cat === i ? "" : " dim"));
    }

    // the hub shows the confirmed pick only; hovering previews in the readout, not here
    var preview = (cur.ring === "outer" && src[cur.index]) ? src[cur.index] : null;
    hubGlyph.textContent = state.current;
    hubFace.setAttribute("class", "hub-face" + (cur.ring === "hub" ? " armed" : ""));

    dial.classList.toggle("is-closed", !state.open);
    document.querySelector(".readout").classList.toggle("is-hidden", !state.open);

    elEyebrow.textContent = ringName();
    elEyebrow.className = "eyebrow on";
    elTitle.textContent = nameOf(preview || state.current);
    elTitle.className = "title" + (preview ? "" : " is-resting");
    elCounter.textContent = (cur.ring === "outer" && cur.index >= 0)
      ? (cur.index + 1) + " / " + N_OUT
      : "";
  }

  // ---------- hit testing: angle + radius, no per-path hover ----------
  // There is no outer bound: past the rim the dial keeps tracking the item whose
  // wedge your angle falls in, the way a thrown pie-menu gesture should.
  function hit(clientX, clientY) {
    var box = dial.getBoundingClientRect();
    var scale = 400 / box.width;
    var x = (clientX - box.left) * scale - CX;
    var y = (clientY - box.top) * scale - CY;
    var r = Math.sqrt(x * x + y * y);
    if (r <= R.hub + 3) return { ring: "hub", index: 0 };

    var deg = Math.atan2(y, x) * 180 / Math.PI + 90;
    deg = ((deg % 360) + 360) % 360;

    if (r <= (R.in1 + R.out0) / 2) return { ring: "inner", index: Math.floor(deg / STEP_IN) % N_IN };
    return { ring: "outer", index: Math.floor(deg / STEP_OUT) % N_OUT };
  }

  function sameCursor(a, b) { return a.ring === b.ring && a.index === b.index; }

  function moveCursor(next) {
    if (!state.open && next.ring !== "hub") next = { ring: null, index: -1 };
    if (sameCursor(state.cursor, next)) return;
    state.cursor = next;
    if (next.ring === "inner") state.cat = next.index;
    render();
  }

  // ---------- actions ----------
  function openMenu() {
    state.open = true;
    render();
  }

  function closeMenu() {
    state.open = false;
    state.cursor = { ring: null, index: -1 };
    render();
  }

  function pick(index) { pickGlyph(outerSource()[index]); }

  function pickGlyph(g) {
    if (!g) return;
    state.current = g;
    CATS[state.cat].recent = g;   // the rings never reorder; only this one glyph changes
    closeMenu();                  // confirming a pick puts the dial away
  }

  function copyToClipboard(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function () {});
      }
    } catch (e) { /* clipboard unavailable; nothing to report */ }
  }

  function activate() {
    var c = state.cursor;
    if (!state.open) {
      if (c.ring === "hub") openMenu();
      return;
    }
    if (c.ring === "outer") pick(c.index);
    // clicking a category takes its last-used glyph straight away
    else if (c.ring === "inner") { state.cat = c.index; pickGlyph(CATS[c.index].recent); }
    else if (c.ring === "hub") { copyToClipboard(state.current); closeMenu(); }
  }

  // ---------- pointer ----------
  // Tracking lives on the document, not the dial, so the aim survives leaving the circle.
  function offDial(e) {
    return !!(e.target && e.target.closest && e.target.closest("button"));
  }

  document.addEventListener("pointermove", function (e) {
    if (offDial(e)) return;
    moveCursor(hit(e.clientX, e.clientY));
  });
  document.addEventListener("pointerdown", function (e) {
    if (offDial(e)) return;
    moveCursor(hit(e.clientX, e.clientY));
  });
  document.addEventListener("pointerup", function (e) {
    if (offDial(e)) return;
    moveCursor(hit(e.clientX, e.clientY));
    activate();
  });

  // ---------- keyboard ----------
  document.addEventListener("keydown", function (e) {
    var c = state.cursor, k = e.key;
    if (!state.open) {
      if (k === "Enter" || k === " ") { e.preventDefault(); openMenu(); }
      return;
    }
    var step = 0;
    if (k === "ArrowRight") step = 1;
    else if (k === "ArrowLeft") step = -1;

    if (step !== 0) {
      e.preventDefault();
      if (c.ring === "outer") moveCursor({ ring: "outer", index: (c.index + step + N_OUT) % N_OUT });
      else if (c.ring === "inner") moveCursor({ ring: "inner", index: (c.index + step + N_IN) % N_IN });
      else moveCursor({ ring: "inner", index: step > 0 ? 0 : N_IN - 1 });
      return;
    }
    if (k === "ArrowUp" || k === "ArrowDown") {
      e.preventDefault();
      var order = ["hub", "inner", "outer"];
      var at = order.indexOf(c.ring);
      if (at === -1) at = 0;
      var to = order[Math.min(order.length - 1, Math.max(0, at + (k === "ArrowDown" ? 1 : -1)))];
      moveCursor({ ring: to, index: to === "hub" ? 0 : 0 });
      return;
    }
    if (k === "Enter" || k === " ") { e.preventDefault(); activate(); return; }
    if (k === "Escape") { e.preventDefault(); closeMenu(); }
  });

  // ---------- go ----------
  build();
  render();
})();
</script>
</body>
</html>
